name: ci

on:
  pull_request:
    # labeled/unlabeled: release-checks re-reads the release:major-approved label.
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-helm.yml@dc7434879fbd0db1d1df9f590ed8bc13789bd320 # v1.9.2
    with:
      # Each target runs the chart's unit tests and its values.schema.json drift check;
      # helm.test.app also runs the agent bootstrap script test (ci/agent-bootstrap).
      make-targets: helm.test.app helm.test.agent
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@dc7434879fbd0db1d1df9f590ed8bc13789bd320 # v1.9.2
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@dc7434879fbd0db1d1df9f590ed8bc13789bd320 # v1.9.2
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit

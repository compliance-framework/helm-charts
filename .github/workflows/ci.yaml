name: CI

on:
  pull_request:
    branches: [ main, master ]

jobs:
  helm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: Run Helm Tests
        run: |
          make helm.test

      - name: Verify Helm Schema
        run: |
          make helm.schema
          make check-diff
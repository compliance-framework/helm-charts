name: cut-prerelease

# Cuts a release candidate of one chart from the open release-please PR: tags
# <component>-vX.Y.Z-rcN on main and creates a GitHub prerelease, which runs release.yml and
# publishes <chart>:X.Y.Z-rcN. Pick the chart: the release PR's manifest also lists charts that
# have nothing to release, at their released version.
on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart to cut a release candidate of"
        type: choice
        required: true
        options:
          - ccf-app
          - ccf-agent

permissions:
  contents: read

jobs:
  ccf-app:
    if: inputs.chart == 'ccf-app'
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      path: charts/ccf-app
      tag-prefix: ccf-app-v
    permissions:
      contents: read
    secrets: inherit

  ccf-agent:
    if: inputs.chart == 'ccf-agent'
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      path: charts/ccf-agent
      tag-prefix: ccf-agent-v
    permissions:
      contents: read
    secrets: inherit

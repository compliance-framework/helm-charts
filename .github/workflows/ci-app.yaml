name: CI - CCF App

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'charts/ccf-app/**'
      - 'Makefile'
      - '.github/workflows/ci-app.yaml'

jobs:
  helm-check-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: Run Helm Tests for ccf-app
        run: |
          make helm.test

      - name: Verify Helm Schema for ccf-app
        run: |
          make helm.schema
          make check-diff
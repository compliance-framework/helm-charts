name: Release - CCF App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'charts/ccf-app/Chart.yaml'

jobs:
  release-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: Extract chart version
        id: chart-version
        run: |
          VERSION=$(grep '^version:' charts/ccf-app/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Check if package exists
        id: check-package
        run: |
          # Try to pull the package to see if it exists
          if helm pull oci://ghcr.io/compliance-framework/helm-charts/ccf-app --version ${{ steps.chart-version.outputs.version }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Package ccf-app:${{ steps.chart-version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Package ccf-app:${{ steps.chart-version.outputs.version }} does not exist"
          fi

      - name: Login to GitHub Container Registry
        if: steps.check-package.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        if: steps.check-package.outputs.exists == 'false'
        run: |
          helm package charts/ccf-app

      - name: Push to GHCR
        if: steps.check-package.outputs.exists == 'false'
        run: |
          helm push ccf-app-${{ steps.chart-version.outputs.version }}.tgz oci://ghcr.io/compliance-framework/helm-charts

      - name: Skip release (package exists)
        if: steps.check-package.outputs.exists == 'true'
        run: |
          echo "✅ Package ccf-app:${{ steps.chart-version.outputs.version }} already exists, skipping release"

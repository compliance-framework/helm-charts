name: CI - Argo CD compatibility

# Renders both charts the way Argo CD does and syncs them with a real Argo CD on kind. Fails on
# anything that is not stable under `helm template` without cluster access (lookup, random or
# generated values), which would leave Argo CD Applications permanently OutOfSync.
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'ci/argocd/**'
      - '.github/workflows/argocd.yaml'

permissions:
  contents: read

jobs:
  argocd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.14.4

      - name: Render twice, no lookup
        run: ci/argocd/check.sh render

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: argocd-check

      - name: Sync with Argo CD and check it stays Synced
        env:
          REPO_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: ci/argocd/check.sh argocd

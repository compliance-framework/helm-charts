name: CI - Argo CD compatibility

# Renders both charts the way Argo CD does and syncs them with a real Argo CD on kind. Fails on
# anything that is not stable under `helm template` without cluster access (lookup, random or
# generated values), which would leave Argo CD Applications permanently OutOfSync.
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'ci/argocd/**'
      - '.github/workflows/argocd.yaml'

permissions:
  contents: read

jobs:
  argocd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The kind release and the node image it was built for (from its release notes), pinned by
      # digest so a cluster is the same on every run.
      KIND_VERSION: v0.33.0
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      KIND_CLUSTER: argocd-check
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Render twice, no lookup
        run: ci/argocd/check.sh render

      # Creating the cluster is retried once: it downloads the kind binary and the node image, and a
      # bad download (e.g. a kind binary that fails its checksum) fails the step without saying
      # anything about the charts.
      - name: Create kind cluster
        id: kind
        continue-on-error: true
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Remove the half-created kind cluster
        if: steps.kind.outcome == 'failure'
        run: |
          echo "::warning::creating the kind cluster failed; retrying once"
          docker ps -aq --filter "label=io.x-k8s.kind.cluster=$KIND_CLUSTER" | xargs -r docker rm -f
          sleep 15

      - name: Create kind cluster (retry)
        if: steps.kind.outcome == 'failure'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Sync with Argo CD and check it stays Synced
        env:
          REPO_URL: https://github.com/${{ github.event.pull_request.head.repo.full_name }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: ci/argocd/check.sh argocd

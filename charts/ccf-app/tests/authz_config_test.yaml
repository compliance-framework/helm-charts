suite: Authorization configuration
templates:
  - templates/configmap_api.yaml
  - templates/configmap_api_authz.yaml
  - templates/configmap_api_authz_policies.yaml
  - templates/deployment_api.yaml
  - templates/configmap_api_sso.yaml
  - templates/configmap_api_email.yaml
  - templates/configmap_api_slack.yaml
  - templates/configmap_api_workflow.yaml
  - templates/secrets_api_config.yaml
values:
  - values/credentials.yaml
release:
  name: ccf-app
  namespace: default

tests:
  - it: AuthZ enabled defaults to the builtin engine
    set:
      api.enabled: true
    asserts:
      - equal:
          path: data["CCF_AUTHZ_DRIVER"]
          value: "builtin"
        template: templates/configmap_api.yaml
      - equal:
          path: data["CCF_AUTHZ_FAIL_MODE"]
          value: "closed"
        template: templates/configmap_api.yaml
      - equal:
          path: data["CCF_AUTHZ_ROLE_ASSIGNMENTS"]
          value: "/etc/ccf/authz-roles.yaml"
        template: templates/configmap_api.yaml
      - notExists:
          path: data["CCF_AUTHZ_CEDAR_POLICY_DIR"]
        template: templates/configmap_api.yaml
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: ccf-app-api-authz
        template: templates/configmap_api_authz.yaml
      - matchRegex:
          path: data["authz-roles.yaml"]
          pattern: "agents: agent"
        template: templates/configmap_api_authz.yaml

  - it: Cedar engine renders role assignments from values
    set:
      api.enabled: true
      api.authz.driver: "cedar"
      api.authz.failMode: "open"
      api.authz.roleAssignments:
        users:
          admin@example.com: admin
        groups:
          ccf-admins: admin
          ccf-users: contributor
        agents: agent
    asserts:
      - equal:
          path: data["CCF_AUTHZ_DRIVER"]
          value: "cedar"
        template: templates/configmap_api.yaml
      - equal:
          path: data["CCF_AUTHZ_FAIL_MODE"]
          value: "open"
        template: templates/configmap_api.yaml
      - matchRegex:
          path: data["authz-roles.yaml"]
          pattern: "admin@example.com: admin"
        template: templates/configmap_api_authz.yaml
      - matchRegex:
          path: data["authz-roles.yaml"]
          pattern: "ccf-users: contributor"
        template: templates/configmap_api_authz.yaml

  - it: AuthZ enabled mounts the roles file into the api container
    set:
      api.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/ccf/authz-roles.yaml
            name: api-authz-config
            subPath: authz-roles.yaml
            readOnly: true
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: api-authz-config
            configMap:
              name: ccf-app-api-authz
        template: templates/deployment_api.yaml

  - it: cedarPolicyDir injects the policy dir env var when set
    set:
      api.enabled: true
      api.authz.driver: "cedar"
      api.authz.cedar.policyDir: "/authz-policies"
    asserts:
      - equal:
          path: data["CCF_AUTHZ_CEDAR_POLICY_DIR"]
          value: "/authz-policies"
        template: templates/configmap_api.yaml

  # Invalid enum values are rejected by the values.schema.json `enum` constraint
  # (generated from the `@schema enum:` annotations in values.yaml). These guard
  # against the annotation being dropped.
  - it: Rejects an invalid driver
    set:
      api.enabled: true
      api.authz.driver: "bogus"
    asserts:
      - failedTemplate: {}

  - it: Rejects an invalid failMode
    set:
      api.enabled: true
      api.authz.failMode: "maybe"
    asserts:
      - failedTemplate: {}

  - it: mounts the roles file in migrate-db and create-user, which run the API binary
    set:
      api.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "migrate-db")].volumeMounts
          content:
            mountPath: /etc/ccf/authz-roles.yaml
            name: api-authz-config
            subPath: authz-roles.yaml
            readOnly: true
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "create-user")].volumeMounts
          content:
            mountPath: /etc/ccf/authz-roles.yaml
            name: api-authz-config
            subPath: authz-roles.yaml
            readOnly: true
        template: templates/deployment_api.yaml

  - it: mounts the roles file with in-memory JWT keys and no other config files (cedar)
    set:
      api.enabled: true
      api.jwt.source: inMemory
      api.authz.driver: cedar
      api.authz.roleAssignments:
        users:
          admin@example.com: admin
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - mountPath: /etc/ccf/authz-roles.yaml
              name: api-authz-config
              subPath: authz-roles.yaml
              readOnly: true
            - mountPath: /tmp
              name: tmp
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "migrate-db")].volumeMounts
          value:
            - mountPath: /etc/ccf/authz-roles.yaml
              name: api-authz-config
              subPath: authz-roles.yaml
              readOnly: true
            - mountPath: /tmp
              name: tmp
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "create-user")].volumeMounts
          content:
            mountPath: /etc/ccf/authz-roles.yaml
            name: api-authz-config
            subPath: authz-roles.yaml
            readOnly: true
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: api-authz-config
              configMap:
                name: ccf-app-api-authz
            - name: tmp
              emptyDir: {}
        template: templates/deployment_api.yaml
      - equal:
          path: data["CCF_AUTHZ_ROLE_ASSIGNMENTS"]
          value: "/etc/ccf/authz-roles.yaml"
        template: templates/configmap_api.yaml

  - it: authzen driver passes the endpoint and cache TTL
    set:
      api.enabled: true
      api.authz.driver: authzen
      api.authz.authzen.endpoint: https://pdp.internal/access/v1/evaluation
      api.authz.authzen.cacheTtl: 5s
    asserts:
      - equal:
          path: data["CCF_AUTHZ_DRIVER"]
          value: "authzen"
        template: templates/configmap_api.yaml
      - equal:
          path: data["CCF_AUTHZ_ENDPOINT"]
          value: "https://pdp.internal/access/v1/evaluation"
        template: templates/configmap_api.yaml
      - equal:
          path: data["CCF_AUTHZ_CACHE_TTL"]
          value: "5s"
        template: templates/configmap_api.yaml

  - it: does not render authzen settings by default
    set:
      api.enabled: true
    asserts:
      - notExists:
          path: data["CCF_AUTHZ_ENDPOINT"]
        template: templates/configmap_api.yaml
      - notExists:
          path: data["CCF_AUTHZ_CACHE_TTL"]
        template: templates/configmap_api.yaml

  - it: fails when the authzen driver has no endpoint
    set:
      api.enabled: true
      api.authz.driver: authzen
    asserts:
      - failedTemplate:
          errorPattern: "api.authz.authzen.endpoint is required when api.authz.driver is authzen"
        template: templates/deployment_api.yaml

  - it: rejects a cache TTL that is not a duration
    set:
      api.enabled: true
      api.authz.authzen.cacheTtl: "5"
    asserts:
      - failedTemplate: {}

  - it: renders cedar policies into a ConfigMap and mounts them at the default policy dir
    set:
      api.enabled: true
      api.authz.driver: cedar
      api.authz.cedar.policies:
        extra.cedar: |
          permit (principal, action, resource);
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: ccf-app-api-authz-policies
        template: templates/configmap_api_authz_policies.yaml
      - equal:
          path: data["extra.cedar"]
          value: |
            permit (principal, action, resource);
        template: templates/configmap_api_authz_policies.yaml
      - equal:
          path: data["CCF_AUTHZ_CEDAR_POLICY_DIR"]
          value: "/etc/ccf/cedar-policies"
        template: templates/configmap_api.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/ccf/cedar-policies
            name: api-authz-policies
            readOnly: true
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: api-authz-policies
            configMap:
              name: ccf-app-api-authz-policies
        template: templates/deployment_api.yaml
      - exists:
          path: spec.template.metadata.annotations["checksum/authz-policies"]
        template: templates/deployment_api.yaml

  - it: mounts an existing cedar policy ConfigMap at policyDir
    set:
      api.enabled: true
      api.authz.driver: cedar
      api.authz.cedar.existingConfigMap: my-cedar-policies
      api.authz.cedar.policyDir: /authz-policies
    asserts:
      - hasDocuments:
          count: 0
        template: templates/configmap_api_authz_policies.yaml
      - equal:
          path: data["CCF_AUTHZ_CEDAR_POLICY_DIR"]
          value: "/authz-policies"
        template: templates/configmap_api.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /authz-policies
            name: api-authz-policies
            readOnly: true
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: api-authz-policies
            configMap:
              name: my-cedar-policies
        template: templates/deployment_api.yaml

  - it: only sets the policy dir env when policyDir is given without policies
    set:
      api.enabled: true
      api.authz.cedar.policyDir: /authz-policies
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "api-authz-policies")]
        template: templates/deployment_api.yaml

  - it: rejects a policy file name without the .cedar suffix
    set:
      api.enabled: true
      api.authz.cedar.policies:
        extra.txt: "permit (principal, action, resource);"
    asserts:
      - failedTemplate:
          errorPattern: "must be a file name ending in .cedar"
        template: templates/deployment_api.yaml

  - it: rejects policies together with existingConfigMap
    set:
      api.enabled: true
      api.authz.cedar.existingConfigMap: my-cedar-policies
      api.authz.cedar.policies:
        extra.cedar: "permit (principal, action, resource);"
    asserts:
      - failedTemplate:
          errorPattern: "set either policies or existingConfigMap, not both"
        template: templates/deployment_api.yaml

  - it: renders anonymous and ssp-subscriber grants verbatim
    set:
      api.enabled: true
      api.authz.roleAssignments:
        users:
          subscriber@example.com: ssp-subscriber
        anonymous: viewer
    asserts:
      - matchRegex:
          path: data["authz-roles.yaml"]
          pattern: "anonymous: viewer"
        template: templates/configmap_api_authz.yaml
      - matchRegex:
          path: data["authz-roles.yaml"]
          pattern: "subscriber@example.com: ssp-subscriber"
        template: templates/configmap_api_authz.yaml

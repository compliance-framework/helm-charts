suite: postgresql persistent volume test
templates:
  - templates/pv-psql.yaml
  - templates/pvc_psql.yaml
values:
  - values/credentials.yaml
release:
  name: ccf-app
  namespace: default

tests:
  - it: should not create PV when createPersistentVolume is false
    set:
      database:
        local:
          enabled: true
          persistence:
            createPersistentVolume: false
            storageClass: ebs-gp3
            size: 10Gi
    asserts:
      - hasDocuments:
          count: 0
        template: templates/pv-psql.yaml

  - it: should create PV when createPersistentVolume is true
    set:
      database:
        local:
          enabled: true
          persistence:
            createPersistentVolume: true
            storageClass: ebs-gp3
            size: 10Gi
    asserts:
      - hasDocuments:
          count: 1
        template: templates/pv-psql.yaml
      - isKind:
          of: PersistentVolume
        template: templates/pv-psql.yaml

  - it: keeps the 0.8.x defaults (hostPath PV, storageClass standard) so unchanged upgrades keep their volume
    set:
      database:
        local:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: templates/pv-psql.yaml
      - equal:
          path: spec.storageClassName
          value: standard
        template: templates/pv-psql.yaml
      - equal:
          path: spec.hostPath.path
          value: /var/lib/ccf-postgresql
        template: templates/pv-psql.yaml
      - equal:
          path: spec.volumeName
          value: ccf-app-postgresql
        template: templates/pvc_psql.yaml
      - equal:
          path: spec.storageClassName
          value: standard
        template: templates/pvc_psql.yaml

  - it: provisions the PVC dynamically with createPersistentVolume false and the default StorageClass
    set:
      database:
        local:
          enabled: true
          persistence:
            createPersistentVolume: false
            storageClass: ""
    asserts:
      - hasDocuments:
          count: 0
        template: templates/pv-psql.yaml
      - notExists:
          path: spec.volumeName
        template: templates/pvc_psql.yaml
      - notExists:
          path: spec.storageClassName
        template: templates/pvc_psql.yaml

  - it: should not create PV when database local is disabled
    set:
      database:
        local:
          enabled: false
        external:
          existingSecret: "external-db-secret"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/pv-psql.yaml

  - it: should not include volumeName in PVC when createPersistentVolume is false
    set:
      database:
        local:
          enabled: true
          persistence:
            createPersistentVolume: false
            storageClass: ebs-gp3
            size: 10Gi
    asserts:
      - notExists:
          path: spec.volumeName
        template: templates/pvc_psql.yaml

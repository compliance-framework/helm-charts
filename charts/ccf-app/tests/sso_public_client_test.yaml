suite: SSO public OIDC clients (publicClient, no client secret)
templates:
  - templates/configmap_api.yaml
  - templates/configmap_api_sso.yaml
  - templates/configmap_api_email.yaml
  - templates/deployment_api.yaml
  - templates/secrets_api_config.yaml
  - templates/configmap_api_authz.yaml
  - templates/configmap_api_authz_policies.yaml
  - templates/configmap_api_slack.yaml
  - templates/configmap_api_workflow.yaml
values:
  - values/credentials.yaml
release:
  name: ccf-app
  namespace: default
set:
  api.enabled: true
  api.webBaseUrl: "https://ccf.example.com"
  api.sso.enabled: true
  api.sso.providers.dex:
    name: "dex"
    displayName: "Dex"
    provider: "generic"
    protocol: "oidc"
    clientId: "ccf"
    publicClient: true
    issuerUrl: "https://dex.example.com"
    scopes: ["openid", "email", "profile", "groups"]
    enabled: true

tests:
  - it: public client with createSecret renders no client secret env var or secret key
    set:
      api.sso.createSecret: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")]
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")].valueFrom.secretKeyRef
          value:
            name: ccf-app-api-config
            key: CCF_SSO_PROVIDERS_DEX_CLIENT_ID
        template: templates/deployment_api.yaml
      - equal:
          path: data["CCF_SSO_PROVIDERS_DEX_CLIENT_ID"]
          value: "Y2Nm" # base64 for ccf
        template: templates/secrets_api_config.yaml
      - notExists:
          path: data["CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET"]
        template: templates/secrets_api_config.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "public_client: true"
        template: templates/configmap_api_sso.yaml

  - it: public client with existingSecret renders no client secret env var
    set:
      api.sso.existingSecret: "sso-secret"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")]
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")].valueFrom.secretKeyRef
          value:
            name: sso-secret
            key: CCF_SSO_PROVIDERS_DEX_CLIENT_ID
        template: templates/deployment_api.yaml
      - hasDocuments:
          count: 0
        template: templates/secrets_api_config.yaml

  - it: public client with plain values renders no client secret env var
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")]
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")].value
          value: "ccf"
        template: templates/deployment_api.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "public_client: true"
        template: templates/configmap_api_sso.yaml

  - it: a confidential provider next to a public one keeps its client secret (createSecret)
    set:
      api.sso.createSecret: true
      api.sso.providers.google.enabled: true
      api.sso.providers.google.clientId: "google-id"
      api.sso.providers.google.clientSecret: "google-secret"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_GOOGLE_CLIENT_SECRET")].valueFrom.secretKeyRef
          value:
            name: ccf-app-api-config
            key: CCF_SSO_PROVIDERS_GOOGLE_CLIENT_SECRET
        template: templates/deployment_api.yaml
      - equal:
          path: data["CCF_SSO_PROVIDERS_GOOGLE_CLIENT_SECRET"]
          value: "Z29vZ2xlLXNlY3JldA==" # base64 for google-secret
        template: templates/secrets_api_config.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")]
        template: templates/deployment_api.yaml

  - it: a confidential provider keeps its client secret env var (existingSecret)
    set:
      api.sso.existingSecret: "sso-secret"
      api.sso.providers.dex.publicClient: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].valueFrom.secretKeyRef
          value:
            name: sso-secret
            key: CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET
        template: templates/deployment_api.yaml

  - it: a confidential provider keeps its client secret env var (plain values)
    set:
      api.sso.providers.dex.publicClient: false
      api.sso.providers.dex.clientSecret: "dex-secret"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].value
          value: "dex-secret"
        template: templates/deployment_api.yaml

  # Helm stops at the first failing template: the API deployment without createSecret, the
  # config Secret with it.
  - it: fails when a public client sets a clientSecret (API deployment)
    template: templates/deployment_api.yaml
    set:
      api.sso.providers.dex.clientSecret: "dex-secret"
    asserts:
      - failedTemplate:
          errorMessage: "api.sso.providers.dex: publicClient is true but clientSecret is set; a public client has no client secret, so remove clientSecret or set publicClient: false"

  - it: fails when a public client sets a clientSecret (createSecret)
    template: templates/secrets_api_config.yaml
    set:
      api.sso.createSecret: true
      api.sso.providers.dex.clientSecret: "dex-secret"
    asserts:
      - failedTemplate:
          errorMessage: "api.sso.providers.dex: publicClient is true but clientSecret is set; a public client has no client secret, so remove clientSecret or set publicClient: false"

  - it: does not validate a disabled provider
    set:
      api.sso.providers.dex.enabled: false
      api.sso.providers.dex.clientSecret: "dex-secret"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")]
        template: templates/deployment_api.yaml

  - it: fails when a public client uses protocol oauth, compared case-insensitively
    template: templates/deployment_api.yaml
    set:
      api.sso.providers.dex.protocol: " OAuth "
    asserts:
      - failedTemplate:
          errorMessage: 'api.sso.providers.dex: publicClient requires protocol oidc, got "oauth"'

  - it: fails when a public client uses a protocol other than oidc
    template: templates/deployment_api.yaml
    set:
      api.sso.providers.dex.protocol: "saml"
    asserts:
      - failedTemplate:
          errorMessage: 'api.sso.providers.dex: publicClient requires protocol oidc, got "saml"'

  - it: allows a public client with an empty protocol or a mixed-case OIDC
    set:
      api.sso.providers.dex.protocol: ""
      api.sso.providers.github.enabled: true
      api.sso.providers.github.protocol: " OIDC "
      api.sso.providers.github.publicClient: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")]
        template: templates/deployment_api.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_GITHUB_CLIENT_SECRET")]
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")].value
          value: "ccf"
        template: templates/deployment_api.yaml

  - it: treats the string "true" as a public client
    set:
      api.sso.providers.dex.publicClient: "true"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")]
        template: templates/deployment_api.yaml

  - it: treats the string "false" as a confidential client
    set:
      api.sso.providers.dex.publicClient: "false"
      api.sso.providers.dex.clientSecret: "dex-secret"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].value
          value: "dex-secret"
        template: templates/deployment_api.yaml

  - it: fails when publicClient is a string other than "true" or "false"
    template: templates/deployment_api.yaml
    set:
      api.sso.providers.dex.publicClient: "yes"
    asserts:
      - failedTemplate:
          errorMessage: 'api.sso.providers.dex: publicClient must be true or false, got "yes"'

  - it: fails when publicClient is a number
    template: templates/deployment_api.yaml
    set:
      api.sso.providers.dex.publicClient: 1
    asserts:
      - failedTemplate:
          errorMessage: 'api.sso.providers.dex: publicClient must be true or false, got "1"'

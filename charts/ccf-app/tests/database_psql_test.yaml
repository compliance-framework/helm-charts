suite: postgresql deployment test
templates:
  - templates/deployment_psql.yaml
release:
  name: ccf-app
  namespace: default

tests:
  - it: should use default mountPath
    set:
      database:
        local:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/var/lib/postgresql/data"
        template: templates/deployment_psql.yaml

  - it: should use custom mountPath when overridden
    set:
      database:
        local:
          enabled: true
          persistence:
            mountPath: "/custom/pgdata"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/custom/pgdata"
        template: templates/deployment_psql.yaml

  - it: should not render when local database is disabled
    set:
      database:
        local:
          enabled: false
        external:
          existingSecret: "external-db-secret"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/deployment_psql.yaml

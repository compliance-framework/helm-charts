suite: NOTES for the deprecated generated credentials
templates:
  - templates/NOTES.txt
release:
  name: ccf-app
  namespace: default

tests:
  - it: a default install prints one consolidated DEPRECATED notice
    asserts:
      - matchRegexRaw:
          pattern: "DEPRECATED: generated credentials \\(JWT signing key, PostgreSQL password, initial admin user password\\)"
      - matchRegexRaw:
          pattern: "not\\s+GitOps-safe"
      - matchRegexRaw:
          pattern: "will be removed in a future release"
      - matchRegexRaw:
          pattern: "existingSecret \\(the README\\s+copy recipe keeps the current values\\)"

  - it: lists the Dex client secret when Dex uses the generated path
    set:
      webBaseUrl: https://ccf.example.com
      dex.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "initial admin user password, Dex client secret\\)"

  - it: prints no notice when every credential has an explicit source
    values:
      - values/credentials.yaml
    asserts:
      - notMatchRegexRaw:
          pattern: "DEPRECATED"

  - it: names only the credentials that still use the generated path
    set:
      api.jwt.source: inMemory
      api.user.password: explicit
    asserts:
      - matchRegexRaw:
          pattern: "DEPRECATED: generated credentials \\(PostgreSQL password\\)"

  - it: tells fresh installs on the hostPath PV about the 999:999 directory
    asserts:
      - matchRegexRaw:
          pattern: "hostPath PV at /var/lib/ccf-postgresql"
      - matchRegexRaw:
          pattern: "owned by 999:999"

  - it: does not mention the hostPath PV on a dynamically provisioned PVC
    set:
      database.local.persistence.createPersistentVolume: false
    asserts:
      - notMatchRegexRaw:
          pattern: "hostPath PV"

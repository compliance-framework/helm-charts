suite: Pod Security "restricted" for every pod the chart renders
templates:
  - templates/deployment_api.yaml
  - templates/deployment_ui.yaml
  - templates/deployment_dex.yaml
  - templates/deployment_psql.yaml
  - templates/deployment_pgadmin4.yaml
  - templates/test-connection.yaml
  - templates/configmap_api.yaml
  - templates/configmap_api_authz.yaml
  - templates/configmap_api_sso.yaml
  - templates/configmap_api_email.yaml
  - templates/configmap_api_slack.yaml
  - templates/configmap_api_workflow.yaml
  - templates/secrets_api_config.yaml
  - templates/configmap_ui.yaml
  - templates/configmap_ui_nginx.yaml
  - templates/configmap_dex.yaml
  - templates/secrets_dex.yaml
values:
  - values/credentials.yaml
  - values/all_features.yaml
release:
  name: ccf-app
  namespace: default

tests:
  - it: deployment_api pod meets restricted (non-root numeric user, seccomp, no host access or sysctls)
    template: templates/deployment_api.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - notExists:
          path: spec.template.spec.securityContext.sysctls
      - notExists:
          path: spec.template.spec.hostNetwork
      - notExists:
          path: spec.template.spec.hostPID
      - notExists:
          path: spec.template.spec.volumes[?(@.hostPath)]
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
      - notExists:
          path: spec.template.spec.containers[0].securityContext.privileged
      - notEqual:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          value: [ALL]
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.privileged
      - notEqual:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.capabilities.drop
          value: [ALL]
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext.capabilities.add
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext.privileged
      - notEqual:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[2].securityContext.capabilities.drop
          value: [ALL]
      - notExists:
          path: spec.template.spec.initContainers[2].securityContext.capabilities.add
      - notExists:
          path: spec.template.spec.initContainers[2].securityContext.privileged
      - notEqual:
          path: spec.template.spec.initContainers[2].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[3].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[3].securityContext.capabilities.drop
          value: [ALL]
      - notExists:
          path: spec.template.spec.initContainers[3].securityContext.capabilities.add
      - notExists:
          path: spec.template.spec.initContainers[3].securityContext.privileged
      - notEqual:
          path: spec.template.spec.initContainers[3].securityContext.runAsUser
          value: 0

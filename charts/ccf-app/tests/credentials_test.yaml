suite: credential sources (explicit sources and the deprecated generated default)
templates:
  - templates/deployment_api.yaml
  - templates/deployment_psql.yaml
  - templates/deployment_dex.yaml
  - templates/secrets_api.yaml
  - templates/secrets_psql.yaml
  - templates/secrets_dex.yaml
  - templates/externalsecrets.yaml
  - templates/configmap_api.yaml
  - templates/configmap_api_authz.yaml
  - templates/configmap_api_authz_policies.yaml
  - templates/configmap_api_sso.yaml
  - templates/configmap_api_email.yaml
  - templates/configmap_api_slack.yaml
  - templates/configmap_api_workflow.yaml
  - templates/configmap_dex.yaml
  - templates/secrets_api_config.yaml
release:
  name: ccf-app
  namespace: default

tests:
  - it: a plain install renders the four credentials through the deprecated generated path
    set:
      webBaseUrl: https://ccf.example.com
      dex.enabled: true
    asserts:
      - hasDocuments:
          count: 2
        template: templates/secrets_api.yaml
      - matchRegex:
          path: data.password
          pattern: "^[A-Za-z0-9+/]{16}$"
        documentSelector:
          path: metadata.name
          value: ccf-app-initial-user-password
        template: templates/secrets_api.yaml
      - matchRegex:
          path: data["private_key.pem"]
          pattern: "^LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVkt"
        documentSelector:
          path: metadata.name
          value: ccf-app-jwt-private-key
        template: templates/secrets_api.yaml
      - matchRegex:
          path: data.POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9+/]{43}=$"
        template: templates/secrets_psql.yaml
      - matchRegex:
          path: data.CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET
          pattern: "^[A-Za-z0-9+/]{43}=$"
        template: templates/secrets_dex.yaml
      - hasDocuments:
          count: 0
        template: templates/externalsecrets.yaml

  - it: reuses the existing Secrets on the deprecated path (lookup), as before 0.9.0
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ccf-app-psql
            namespace: default
          data:
            POSTGRES_PASSWORD: ZXhpc3RpbmctcGc=
        - kind: Secret
          apiVersion: v1
          metadata:
            name: ccf-app-initial-user-password
            namespace: default
          data:
            password: ZXhpc3RpbmctYWRtaW4=
    asserts:
      - equal:
          path: data.POSTGRES_PASSWORD
          value: ZXhpc3RpbmctcGc=
        template: templates/secrets_psql.yaml
      - equal:
          path: data.password
          value: ZXhpc3RpbmctYWRtaW4=
        documentSelector:
          path: metadata.name
          value: ccf-app-initial-user-password
        template: templates/secrets_api.yaml

  - it: fails when Postgres generation is turned off without another source
    template: templates/deployment_api.yaml
    set:
      database.local.createSecret: false
    asserts:
      - failedTemplate:
          errorPattern: "no source for: PostgreSQL password\\. Generation was turned off"

  - it: fails when Dex generation is turned off without another source
    template: templates/deployment_api.yaml
    set:
      webBaseUrl: https://ccf.example.com
      dex.enabled: true
      dex.clientSecret.createSecret: false
    asserts:
      - failedTemplate:
          errorPattern: "no source for: Dex client secret\\."

  - it: the deprecated generated JWT default renders the Secret and the public-key init container
    set:
      devSecrets.seed: dev
    asserts:
      - hasDocuments:
          count: 2
        template: templates/secrets_api.yaml
      - matchRegex:
          path: data["private_key.pem"]
          pattern: "^LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVkt"
        documentSelector:
          path: metadata.name
          value: ccf-app-jwt-private-key
        template: templates/secrets_api.yaml
      - exists:
          path: spec.template.spec.initContainers[?(@.name == "generate-public-key")]
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: privatekey
            secret:
              secretName: ccf-app-jwt-private-key
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: publickey
            emptyDir: {}
        template: templates/deployment_api.yaml

  - it: fails when api.jwt.source is emptied on purpose
    template: templates/deployment_api.yaml
    set:
      api.jwt.source: ""
      devSecrets.seed: dev
    asserts:
      - failedTemplate:
          errorPattern: "no source for: JWT signing key\\."

  - it: uses existing Secrets for every credential and renders no chart Secret
    set:
      webBaseUrl: https://ccf.example.com
      api.jwt.source: existingSecret
      api.jwt.existingSecret.name: ccf-jwt
      database.local.createSecret: false
      database.local.existingSecret: ccf-postgres
      api.user.existingSecret: ccf-admin
      api.user.passwordKey: admin-password
      dex.enabled: true
      dex.clientSecret.createSecret: false
      dex.clientSecret.existingSecret: ccf-dex
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secrets_api.yaml
      - hasDocuments:
          count: 0
        template: templates/secrets_psql.yaml
      - hasDocuments:
          count: 0
        template: templates/secrets_dex.yaml
      - hasDocuments:
          count: 0
        template: templates/externalsecrets.yaml
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "create-user")].env
          content:
            name: CCF_INITIAL_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ccf-admin
                key: admin-password
        template: templates/deployment_api.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ccf-postgres
                key: POSTGRES_PASSWORD
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: ccf-postgres
        template: templates/deployment_psql.yaml
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: ccf-dex
        template: templates/deployment_dex.yaml

  - it: rejects existingSecret together with createSecret for Postgres
    template: templates/secrets_psql.yaml
    set:
      api.jwt.source: inMemory
      api.user.password: admin-pass
      database.local.existingSecret: ccf-postgres
    asserts:
      - failedTemplate:
          errorPattern: "set createSecret: false to use the existing Secret"

  - it: derives the public key when the existing JWT Secret has no public key
    template: templates/deployment_api.yaml
    set:
      api.jwt.source: existingSecret
      api.jwt.existingSecret.name: ccf-jwt
      api.jwt.existingSecret.publicKey: ""
      devSecrets.seed: dev
    asserts:
      - exists:
          path: spec.template.spec.initContainers[?(@.name == "generate-public-key")]
      - contains:
          path: spec.template.spec.volumes
          content:
            name: publickey
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: privatekey
            secret:
              secretName: ccf-jwt
              items:
                - key: private_key.pem
                  path: private_key.pem

  - it: renders explicit passwords into the chart Secrets
    set:
      api.jwt.source: inMemory
      api.user.password: admin-pass
      database.local.password: db-pass
    asserts:
      - equal:
          path: data.password
          value: YWRtaW4tcGFzcw==
        template: templates/secrets_api.yaml
      - equal:
          path: data.POSTGRES_PASSWORD
          value: ZGItcGFzcw==
        template: templates/secrets_psql.yaml

  - it: derives stable development credentials from devSecrets.seed
    set:
      api.jwt.source: inMemory
      devSecrets.seed: my-dev-seed
      webBaseUrl: https://ccf.example.com
      dex.enabled: true
    asserts:
      # sha256("ccf:postgres:my-dev-seed")[:32], base64 encoded: the same on every render.
      - equal:
          path: data.POSTGRES_PASSWORD
          value: OTYzNTZiZDU1Y2FiYzJiODA3YmI0ZTc3OTBiOTM2M2M=
        template: templates/secrets_psql.yaml
      - equal:
          path: data.password
          value: YjViNjk1ZGFmNDcwMzU5ODEzMmNkYTcyNzhjZWVhYTk=
        template: templates/secrets_api.yaml
      - equal:
          path: data.CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET
          value: YWNkNzE5MzVjM2QzMTU5YTQ1MzhmZDRjZDgwZDYyNmU=
        template: templates/secrets_dex.yaml

  - it: renders ExternalSecrets with Password generators, created once
    set:
      webBaseUrl: https://ccf.example.com
      api.jwt.source: externalSecret
      api.user.externalSecret.enabled: true
      database.local.externalSecret.enabled: true
      dex.enabled: true
      dex.clientSecret.externalSecret.enabled: true
    template: templates/externalsecrets.yaml
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: Password
        documentIndex: 0
      - equal:
          path: metadata.name
          value: ccf-app-psql
        documentIndex: 0
      - equal:
          path: spec.symbols
          value: 0
        documentIndex: 0
      - isKind:
          of: ExternalSecret
        documentIndex: 1
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
        documentIndex: 1
      - equal:
          path: spec.refreshPolicy
          value: CreatedOnce
        documentIndex: 1
      - equal:
          path: spec.target.name
          value: ccf-app-psql
        documentIndex: 1
      - equal:
          path: spec.dataFrom[0].rewrite[0].regexp.target
          value: POSTGRES_PASSWORD
        documentIndex: 1
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef
          value:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: Password
            name: ccf-app-psql
        documentIndex: 1
      - equal:
          path: spec.target.name
          value: ccf-app-initial-user-password
        documentIndex: 3
      - equal:
          path: spec.dataFrom[0].rewrite[0].regexp.target
          value: CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET
        documentIndex: 5
      - equal:
          path: spec.target.name
          value: ccf-app-jwt-private-key
        documentIndex: 7
      - equal:
          path: spec.target.template.data["private_key.pem"]
          value: '{{ genPrivateKey "rsa" }}'
        documentIndex: 7

  - it: does not render chart Secrets for credentials ESO generates
    set:
      api.jwt.source: externalSecret
      api.user.externalSecret.enabled: true
      database.local.externalSecret.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secrets_api.yaml
      - hasDocuments:
          count: 0
        template: templates/secrets_psql.yaml

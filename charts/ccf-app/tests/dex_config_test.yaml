suite: Dex configuration
templates:
  - templates/configmap_api.yaml
  - templates/configmap_api_sso.yaml
  - templates/configmap_dex.yaml
  - templates/deployment_api.yaml
  - templates/deployment_dex.yaml
  - templates/ingress.yaml
  - templates/secrets_dex.yaml
  - templates/service_dex.yaml
release:
  name: ccf-app
  namespace: default

tests:
  - it: does not render Dex resources by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/configmap_dex.yaml
      - hasDocuments:
          count: 0
        template: templates/deployment_dex.yaml
      - hasDocuments:
          count: 0
        template: templates/secrets_dex.yaml
      - hasDocuments:
          count: 0
        template: templates/service_dex.yaml
      - hasDocuments:
          count: 0
        template: templates/configmap_api_sso.yaml

  - it: renders Dex and wires generated client secret into Dex and CCF SSO
    set:
      dex:
        enabled: true
        clientSecret:
          value: ccf-local-secret
        sso:
          displayName: Dex LDAP
          requiredLoginGroups:
            - ccf-users
          requiredAdminGroups:
            - ccf-admins
          groupMapping:
            groups:ccf-users:
              - ccf-users
        connectors:
          - type: ldap
            id: ldap
            name: Local LDAP
            config:
              host: openldap:389
              insecureNoSSL: true
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: ccf-app-dex
        template: templates/secrets_dex.yaml
      - equal:
          path: data["CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET"]
          value: "Y2NmLWxvY2FsLXNlY3JldA=="
        template: templates/secrets_dex.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "secretEnv: \"CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET\""
        template: templates/configmap_dex.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "https://ccf.example.com/api/auth/sso/callback/dex"
        template: templates/configmap_dex.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "host: openldap:389"
        template: templates/configmap_dex.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].valueFrom.secretKeyRef.name
          value: ccf-app-dex
        template: templates/deployment_dex.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")].value
          value: ccf-ui
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].valueFrom.secretKeyRef.name
          value: ccf-app-dex
        template: templates/deployment_api.yaml
      - equal:
          path: data["CCF_SSO_CONFIG"]
          value: /etc/ccf/sso.yaml
        template: templates/configmap_api.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "display_name: \"Dex LDAP\""
        template: templates/configmap_api_sso.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "issuer_url: \"https://ccf.example.com/dex\""
        template: templates/configmap_api_sso.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "well_known_url: \"http://ccf-app-dex:5556/dex/.well-known/openid-configuration\""
        template: templates/configmap_api_sso.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: 'required_login_groups: \["ccf-users"\]'
        template: templates/configmap_api_sso.yaml
      - equal:
          path: spec.rules[?(@.host == "ccf.example.com")].http.paths[?(@.path == "/dex")].pathType
          value: Prefix
        template: templates/ingress.yaml
      - equal:
          path: spec.rules[?(@.host == "ccf.example.com")].http.paths[?(@.path == "/dex")].backend.service.name
          value: ccf-app-dex
        template: templates/ingress.yaml
      - equal:
          path: spec.rules[?(@.host == "ccf.example.com")].http.paths[?(@.path == "/dex")].backend.service.port.number
          value: 5556
        template: templates/ingress.yaml

  - it: uses an existing client secret for Dex and CCF SSO
    set:
      dex:
        enabled: true
        issuerUrl: http://dex.example.com/dex
        staticClient:
          id: custom-client
          redirectUris:
            - http://app.example.com/api/auth/sso/callback/dex
        clientSecret:
          createSecret: false
          existingSecret: external-dex-secret
          secretKey: client-secret
          envName: DEX_CLIENT_SECRET
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secrets_dex.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "issuer: \"http://dex.example.com/dex\""
        template: templates/configmap_dex.yaml
      - matchRegex:
          path: data["config.yaml"]
          pattern: "secretEnv: \"DEX_CLIENT_SECRET\""
        template: templates/configmap_dex.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "DEX_CLIENT_SECRET")].valueFrom.secretKeyRef.name
          value: external-dex-secret
        template: templates/deployment_dex.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "DEX_CLIENT_SECRET")].valueFrom.secretKeyRef.key
          value: client-secret
        template: templates/deployment_dex.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_ID")].value
          value: custom-client
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].valueFrom.secretKeyRef.name
          value: external-dex-secret
        template: templates/deployment_api.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET")].valueFrom.secretKeyRef.key
          value: client-secret
        template: templates/deployment_api.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "issuer_url: \"http://dex.example.com/dex\""
        template: templates/configmap_api_sso.yaml
      - matchRegex:
          path: data["sso.yaml"]
          pattern: "well_known_url: \"http://ccf-app-dex:5556/dex/.well-known/openid-configuration\""
        template: templates/configmap_api_sso.yaml

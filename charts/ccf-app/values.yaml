# Default values for ccf-app.
# This file is YAML-formatted. Declare variables to be passed into your templates.

# Labels defined here are merged into every rendered object.
commonLabels: {}

# Pod-level metadata applied to all workloads unless overridden per component.
podAnnotations: {}
podLabels: {}

# Secrets for pulling an image from a private repository.
imagePullSecrets: []

# Override chart name and fullname helpers.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials.
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Pod security context shared by all workloads.
podSecurityContext: {}

# Container security context shared by all workloads unless overridden per component.
securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Global ingress settings that apply to every component ingress rule.
ingress:
  enabled: true
  className: ""
  annotations: {}
  labels: {}
  tls: []

api:
  enabled: true
  replicaCount: 1
  webBaseUrl: "http://localhost:8080"
  environment: "production" ## Set this to local if you are not running with https
  extraConfig: {} ## optional key-value pair to inject as part of the loaded configmap
  # CCF_EMAIL_DIGEST_SCHEDULE: "@weekly"
  # CCF_EMAIL_DIGEST_ENABLED: "true"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 50m
          memory: 10Mi
        maxAllowed:
          cpu: 512m
          memory: 256Mi
    recommenders: []
  image:
    repository: ghcr.io/compliance-framework/api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.11.0"
  containerPort: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: http
    annotations: {}
    labels: {}
  livenessProbe:
    httpGet:
      path: /api/auth/publickey
      port: http
  readinessProbe:
    httpGet:
      path: /api/auth/publickey
      port: http
  corsOrigins:
    - https://ccf.example.com
  user:
    username: admin@localhost
    email: admin@localhost
    password: ""
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf-api.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

  # SSO configuration
  sso:
    enabled: false
    # createSecret: true # If true, a secret will be created with sensitive values
    # existingSecret: "" # If provided, sensitive values will be pulled from this secret
    baseUrl: "http://localhost:8000"
    callbackUrl: "http://localhost:8080/api/auth/sso/callback"
    providers:
      google:
        name: "google"
        displayName: "Google"
        provider: "google"
        protocol: "oidc"
        iconUrl: "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        clientId: ""
        clientSecret: ""
        issuerUrl: "https://accounts.google.com"
        scopes: ["openid", "email", "profile"]
        enabled: false
      github:
        name: "github"
        displayName: "GitHub"
        provider: "github"
        protocol: "oauth"
        iconUrl: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
        clientId: ""
        clientSecret: ""
        authUrl: "https://github.com/login/oauth/authorize"
        tokenUrl: "https://github.com/login/oauth/access_token"
        userInfoUrl: "https://api.github.com/user"
        emailUrl: "https://api.github.com/user/emails"
        scopes: ["read:user", "user:email", "read:org"]
        enabled: false
        groupMapping:
          "github-organization:compliance-framework": ["ccf-authorized-users"]

  # Email configuration
  email:
    enabled: false
    # createSecret: true # If true, a secret will be created with sensitive values
    # existingSecret: "" # If provided, sensitive values will be pulled from this secret
    provider: "smtp"
    providers:
      smtp:
        enabled: true
        name: "SMTP"
        host: "localhost"
        port: 2525
        username: "testuser"
        password: "testpass"
        from: "noreply@compliance-framework.local"
        fromName: "Compliance Framework"
        useSsl: false
        useTls: false
      ses:
        enabled: false
        name: "AWS SES"
        region: "us-east-1"
        from: "noreply@compliance-framework.local"
        fromName: "Compliance Framework"
        # accessKeyId: ""
        # secretAccessKey: ""
        # sessionToken: ""

ui:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 50m
          memory: 10Mi
        maxAllowed:
          cpu: 512m
          memory: 256Mi
    recommenders: []
  image:
    repository: ghcr.io/compliance-framework/ui
    pullPolicy: IfNotPresent
    tag: "2.6.1"
  containerPort: 80
  service:
    enabled: true
    type: ClusterIP
    port: 8000
    targetPort: http
    annotations: {}
    labels: {}
  apiUrl: "https://ccf-api.example.com"
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

# Database configuration for either bundled or external PostgreSQL.
database:
  local:
    enabled: true
    createSecret: true
    existingSecret: ""
    username: ccf
    database: ccf
    password: ""
    vpa:
      enabled: false
      updatePolicy:
        updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
      resourcePolicy:
        containerPolicy:
          mode: Auto # @schema enum:[Off, Auto]
          controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
          minAllowed:
            cpu: 100m
            memory: 128Mi
          maxAllowed:
            cpu: 512m
            memory: 512Mi
      recommenders: []
    image:
      repository: postgres
      tag: 17.5
      pullPolicy: IfNotPresent
    persistence:
      createPersistentVolume: true # Set false when using a dynamic storageClass (e.g., ebs-gp3)
      existingVolume: ""
      size: 10Gi
      storageClass: "standard"
      volumeMode: Filesystem
      accessModes:
        - ReadWriteOnce
      reclaimPolicy: Delete
      path: "/var/lib/ccf-postgresql"
      nodeAffinity: {}
    resources: {}
  external:
    secretRef: ""
    hostname: ""
    host: ""
    port: 5432
    existingSecret: ""
    username: ""
    database: ""
    usernameKey: username
    passwordKey: password
    databaseKey: database

pgadmin4:
  enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  vpa:

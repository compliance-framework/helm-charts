# Default values for ccf-app.
# This file is YAML-formatted. Declare variables to be passed into your templates.

# Labels defined here are merged into every rendered object.
commonLabels: {}

# Pod-level metadata applied to all workloads unless overridden per component.
podAnnotations: {}
podLabels: {}

# Secrets for pulling an image from a private repository.
imagePullSecrets: []

# Override chart name and fullname helpers.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials.
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Pod security context shared by all workloads.
podSecurityContext: {}

# Container security context shared by all workloads unless overridden per component.
securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Global ingress settings that apply to every component ingress rule.
ingress:
  enabled: true
  className: ""
  annotations: {}
  labels: {}
  tls: []

api:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  image:
    repository: ghcr.io/compliance-framework/api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.4.7"
  containerPort: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: http
    annotations: {}
    labels: {}
  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
  corsOrigins:
    - https://ccf.example.com
  user:
    username: admin@localhost
    email: admin@localhost
    password: ""
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf-api.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

ui:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  image:
    repository: ghcr.io/compliance-framework/ui
    pullPolicy: IfNotPresent
    tag: "2.0.7"
  containerPort: 80
  service:
    enabled: true
    type: ClusterIP
    port: 8000
    targetPort: http
    annotations: {}
    labels: {}
  apiUrl: "https://ccf-api.example.com"
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

# Database configuration for either bundled or external PostgreSQL.
database:
  local:
    enabled: true
    username: ccf
    database: ccf
    password: ""
    image:
      repository: postgres
      tag: 17.5
      pullPolicy: IfNotPresent
    persistence:
      existingVolume: "ccf-postgresql-helm"
      size: 10Gi
      storageClass: standard
      volumeMode: Filesystem
      path: "/mnt/disks/ccf-postgresql-helm"
      nodeAffinity: {}
    resources: {}
  external:
    secretRef: ""
    hostname: ""
    host: ""
    port: 5432
    existingSecret: ""
    username: ""
    database: ""
    usernameKey: username
    passwordKey: password
    databaseKey: database

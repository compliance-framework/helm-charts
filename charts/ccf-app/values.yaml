# Default values for ccf-app.
# This file is YAML-formatted. Declare variables to be passed into your templates.

# Labels defined here are merged into every rendered object.
commonLabels: {}

# Pod-level metadata applied to all workloads unless overridden per component.
podAnnotations: {}
podLabels: {}

# Secrets for pulling an image from a private repository.
imagePullSecrets: []

# Override chart name and fullname helpers.
nameOverride: ""
fullnameOverride: ""

# Web Base URL - Use it to configure default networking configuration for ccf
webBaseUrl: ""

# Credentials. Each one comes from, highest first: an existingSecret, an External Secrets
# Operator ExternalSecret, an explicit value, the development seed below, or (the DEPRECATED
# default, as before 0.9.0) a value the chart generates with lookup + random (a new JWT key on
# every render). The generated default is not GitOps-safe: under helm template / Argo CD lookup
# returns nothing, so the values change on every sync. NOTES print a DEPRECATED notice for each
# generated credential. See the README, section Credentials.
devSecrets:
  # DEVELOPMENT ONLY. When set, the Postgres password, the initial user's password and the Dex
  # client secret default to values derived from this seed (sha256 of purpose + seed). They stay
  # the same across renders and upgrades, but anyone who knows the seed knows them. Never use it
  # in production or commit a real seed. Empty (the default) disables it.
  seed: ""

# External Secrets Operator (https://external-secrets.io) settings, used by every
# `externalSecret.enabled: true` below. Needs ESO with the external-secrets.io/v1 API and the
# Password generator (ESO 0.17 or later).
# ESO generation is for FRESH installs: the generated Secrets take the names the chart used to
# create itself, so switching an existing install to ESO replaces its values (the Postgres password
# no longer matches the initialised database, the admin password no longer matches its Secret, and
# the JWT key rotates). Existing installs keep their values with existingSecret (README upgrade
# notes), or rotate the Postgres password themselves before switching.
externalSecrets:
  apiVersion: external-secrets.io/v1
  generatorApiVersion: generators.external-secrets.io/v1alpha1
  # CreatedOnce: the value is generated once and never rotated (a rotated database password
  # would lock the API out of an initialised database).
  refreshPolicy: CreatedOnce # @schema enum:[CreatedOnce, Periodic, OnChange]
  # Spec of the Password generators (no symbols: the password goes into a connection string).
  passwordGenerator:
    length: 32
    digits: 6
    symbols: 0
    noUpper: false
    allowRepeat: true

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials.
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Pod security context shared by all workloads unless overridden per component. Empty (the
# default) uses each component's hardened default: non-root as the image's own user, seccomp
# RuntimeDefault (see the component's podSecurityContext comment and the README).
podSecurityContext: {}

# Container security context shared by all workloads unless overridden per component. Empty uses
# the hardened default: read-only root filesystem, no privilege escalation, all capabilities
# dropped, seccomp RuntimeDefault, with emptyDirs for every path the image writes.
securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Global ingress settings that apply to every component ingress rule.
ingress:
  enabled: true
  className: ""
  annotations: {}
  labels: {}
  tls: []

api:
  enabled: true
  replicaCount: 1
  webBaseUrl: ""
  environment: "production" ## Set this to local if you are not running with https
  extraConfig: {} ## optional key-value pair to inject as part of the loaded configmap
  # CCF_EMAIL_DIGEST_SCHEDULE: "@weekly"
  # CCF_EMAIL_DIGEST_ENABLED: "true"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 50m
          memory: 10Mi
        maxAllowed:
          cpu: 512m
          memory: 256Mi
    recommenders: []
  image:
    repository: ghcr.io/compliance-framework/api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.17.1"
  # JWT signing key management for the API.
  jwt:
    # Where the API's JWT signing key comes from:
    # generated:      DEPRECATED, the default (as before 0.9.0). The chart creates
    #                 <fullname>-jwt-private-key with a new key on every render (no lookup): every
    #                 helm upgrade and every GitOps sync rotates it, logging everyone out and
    #                 invalidating agent tokens. Will be removed; migrate to existingSecret (the
    #                 README copy recipe keeps the current key) or externalSecret.
    # existingSecret: an existing Secret (api.jwt.existingSecret). With publicKey empty, the
    #                 public key is derived from the private key by the init container below.
    # externalSecret: External Secrets Operator creates <fullname>-jwt-private-key once (an RSA
    #                 key made by the ESO template function genPrivateKey); the public key is
    #                 derived by the init container below. Fresh installs only.
    # inMemory:       DEVELOPMENT ONLY. The API generates a key at every start (sessions and agent
    #                 tokens end on every restart; one replica only).
    # An empty value fails rendering.
    source: generated # @schema enum:["", existingSecret, externalSecret, inMemory, generated]
    existingSecret:
      name: ""
      privateKey: private_key.pem
      # Key holding the PEM public key. Empty: derive it from the private key.
      publicKey: public_key.pem
    publicKeyGeneration:
      enabled: true
      # Derives /var/ccf/public_key/public_key.pem from the private key. The default image ships
      # openssl (nothing is installed at runtime) and runs as the API pod's non-root user with a
      # read-only root filesystem, writing only to the shared publickey emptyDir.
      initContainer:
        name: generate-public-key
        image:
          repository: alpine/openssl
          tag: "3.5.9"
          pullPolicy: IfNotPresent
        command:
          - openssl
        args:
          - rsa
          - -in
          - /var/ccf/private_key/private_key.pem
          - -pubout
          - -out
          - /var/ccf/public_key/public_key.pem
        # securityContext for this init container. Empty uses the API container's context
        # (api.securityContext, the global securityContext, or the hardened default).
        securityContext: {}
  containerPort: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: http
    annotations: {}
    labels: {}
  # Liveness: GET /api/health (process up). Readiness: GET /api/health/ready (database ping
  # and, with the authzen driver, the remote PDP).
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
  readinessProbe:
    httpGet:
      path: /api/health/ready
      port: http
  corsOrigins: [] # @schema item:string
  # Initial admin user, created by the create-user init container. Its password comes from
  # existingSecret, externalSecret, password, devSecrets.seed, or (DEPRECATED default) lookup +
  # random into <fullname>-initial-user-password.
  user:
    username: admin@localhost
    email: admin@localhost
    # Explicit password, rendered into the <fullname>-initial-user-password Secret.
    password: ""
    # Existing Secret holding the password, and its key.
    existingSecret: ""
    passwordKey: password
    # External Secrets Operator generates <fullname>-initial-user-password once.
    externalSecret:
      enabled: false
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  # Pod securityContext for the API. Empty falls back to the global podSecurityContext, and
  # then to the chart default (every container of the pod, init containers included, runs as
  # 65532):
  #   runAsNonRoot: true
  #   runAsUser: 65532
  #   runAsGroup: 65532
  #   fsGroup: 65532
  #   seccompProfile: {type: RuntimeDefault}
  podSecurityContext: {}
  # Container securityContext for the API container and its init containers (wait-for-postgres,
  # migrate-db, create-user, and generate-public-key unless it has its own). Empty falls back to the global securityContext, and then to
  # the chart default:
  #   runAsNonRoot: true
  #   runAsUser: 65532
  #   runAsGroup: 65532
  #   readOnlyRootFilesystem: true
  #   allowPrivilegeEscalation: false
  #   capabilities: {drop: [ALL]}
  #   seccompProfile: {type: RuntimeDefault}
  # The API writes only to /tmp, which the chart mounts as an emptyDir.
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts: [] # @schema item:object;itemProperties:{"host":{"type":"string"},"paths":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"pathType":{"type":"string"}}}}}

  # SSO configuration
  sso:
    enabled: false
    # createSecret: true # If true, a secret will be created with sensitive values
    # existingSecret: "" # If provided, sensitive values will be pulled from this secret
    baseUrl: ""
    callbackUrl: ""
    providers:
      google:
        name: "google"
        displayName: "Google"
        provider: "google"
        protocol: "oidc"
        iconUrl: "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        clientId: ""
        clientSecret: ""
        issuerUrl: "https://accounts.google.com"
        scopes: ["openid", "email", "profile"]
        enabled: false
      github:
        name: "github"
        displayName: "GitHub"
        provider: "github"
        protocol: "oauth"
        iconUrl: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
        clientId: ""
        clientSecret: ""
        authUrl: "https://github.com/login/oauth/authorize"
        tokenUrl: "https://github.com/login/oauth/access_token"
        userInfoUrl: "https://api.github.com/user"
        emailUrl: "https://api.github.com/user/emails"
        scopes: ["read:user", "user:email", "read:org"]
        enabled: false
        groupMapping:
          "github-organization:compliance-framework": ["ccf-authorized-users"]

  # Slack configuration
  slack:
    enabled: false
    # createSecret: true # If true, a secret will be created with sensitive values
    # existingSecret: "" # If provided, sensitive values will be pulled from this secret
    digestChannel: ""
    redirectUrl: ""
    clientId: ""
    clientSecret: ""
    token: ""

  # Workflow configuration
  workflow:
    enabled: false
    schedulerEnabled: true
    schedule: "@every 15m"
    gracePeriodDays: 7
    overdueCheckEnabled: true
    dueSoonEnabled: true
    dueSoonSchedule: "0 0 8 * * *"
    taskDigestEnabled: true
    taskDigestSchedule: "0 0 8 * * *"

  # Email configuration
  email:
    enabled: false
    # createSecret: true # If true, a secret will be created with sensitive values
    # existingSecret: "" # If provided, sensitive values will be pulled from this secret
    provider: "smtp"
    providers:
      smtp:
        enabled: true
        name: "SMTP"
        host: "localhost"
        port: 2525
        username: "testuser"
        password: "testpass"
        from: "noreply@compliance-framework.local"
        fromName: "Compliance Framework"
        useSsl: false
        useTls: false
      ses:
        enabled: false
        name: "AWS SES"
        region: "us-east-1"
        from: "noreply@compliance-framework.local"
        fromName: "Compliance Framework"
        # accessKeyId: ""
        # secretAccessKey: ""
        # sessionToken: ""

  # AI suggestions configuration.
  # Only the API key is sensitive; everything else is plain runtime config injected
  # as CCF_AI_* environment variables. The key follows the same secret management
  # standard as sso/slack/email (inline value, createSecret, or existingSecret).
  ai:
    enabled: false
    # createSecret: true # If true, the API key is stored in a chart-managed secret
    # existingSecret: "" # If provided, the API key is read from this existing secret (key: CCF_AI_API_KEY)
    provider: "anthropic"
    apiKey: "" # sensitive – sourced into CCF_AI_API_KEY
    model: "claude-haiku-4-5"
    requestTimeout: "120s"
    maxControlsPerChunk: 40
    maxLabelSetsPerChunk: 200
    queueWorkers: 4
    maxCallsPerRun: 0
    maxSuggestionsPerRun: 500

  # Authorization (AuthZ) configuration.
  # Selects the PDP engine that authorizes API requests and (for the cedar engine)
  authz:
    # builtin — in-process, reproduces CCF's pre-authz rules (the default).
    # cedar   — embedded Cedar RBAC engine, DENY-BY-DEFAULT; reads roleAssignments below.
    # WARNING: be sure to properly set up `roleAssignments` before switching to cedar driver!
    driver: "builtin" # @schema enum:[builtin, cedar]
    # Behaviour when the PDP is unavailable. No-op for the in-process engines.
    failMode: "closed" # @schema enum:[closed, open]
    # Optional configuration for Cedar driver
    cedar:
      # Optional operator .cedar policy directory escape hatch. When set, only the
      # CCF_AUTHZ_CEDAR_POLICY_DIR env var is injected; the operator is responsible for
      # mounting the directory at this path (e.g. via extraObjects + a custom volume).
      policyDir: ""
    # Static role assignments consumed ONLY by the cedar engine (ignored by builtin).
    # This whole map is rendered verbatim into authz-roles.yaml and mounted into the API,
    # so it can be configured directly here. Cedar is deny-by-default: a subject with no
    # grant (directly or via a group) is denied every request.
    roleAssignments:
      # Per-user grants: login email -> role (admin | contributor | auditor | viewer | agent)
      users: {}
        # admin@example.com: admin
      # Per-group grants: resolved group name -> role (recommended GitOps pattern)
      groups: {}
        # ccf-admins: admin
        # ccf-users: contributor
        # ccf-viewers: viewer
      # Default role granted to every authenticated agent.
      agents: agent

ui:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 50m
          memory: 10Mi
        maxAllowed:
          cpu: 512m
          memory: 256Mi
    recommenders: []
  image:
    repository: ghcr.io/compliance-framework/ui
    pullPolicy: IfNotPresent
    tag: "2.10.1"
  containerPort: 80
  service:
    enabled: true
    type: ClusterIP
    port: 8000
    targetPort: http
    annotations: {}
    labels: {}
  apiUrl: ""
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  # Pod securityContext for the UI. Empty falls back to the global podSecurityContext, then to:
  #   runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101 (the image's nginx user)
  #   seccompProfile: {type: RuntimeDefault}
  #   sysctls: [{name: net.ipv4.ip_unprivileged_port_start, value: "0"}]  (nginx listens on 80)
  podSecurityContext: {}
  # Container securityContext for the UI. Empty falls back to the global securityContext, then
  # to the hardened default (read-only root filesystem; /var/cache/nginx, /run and /tmp are
  # emptyDirs).
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts: [] # @schema item:object;itemProperties:{"host":{"type":"string"},"paths":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"pathType":{"type":"string"}}}}}

dex:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/dexidp/dex
    pullPolicy: IfNotPresent
    tag: "v2.44.0"
  command:
    - dex
    - serve
    - /etc/dex/config.yaml
  config:
    existingSecret: ""
    secretKey: config.yaml
  issuerUrl: ""
  containerPort: 5556
  service:
    enabled: true
    type: ClusterIP
    port: 5556
    targetPort: http
    annotations: {}
    labels: {}
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts: [] # @schema item:object;itemProperties:{"host":{"type":"string"},"paths":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"pathType":{"type":"string"}}}}}
  staticClient:
    id: ccf-ui
    name: CCF UI
    redirectUris: [] # @schema item:string
  # Dex static client secret: existingSecret (with createSecret: false), externalSecret, value,
  # devSecrets.seed, or (DEPRECATED default with createSecret: true) lookup + random.
  clientSecret:
    value: ""
    createSecret: true
    existingSecret: ""
    secretKey: CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET
    # External Secrets Operator generates <fullname>-dex once.
    externalSecret:
      enabled: false
    envName: CCF_SSO_PROVIDERS_DEX_CLIENT_SECRET
  sso:
    name: dex # @schema pattern: ^[A-Za-z_][A-Za-z0-9_]*$
    displayName: Dex
    provider: generic
    protocol: oidc
    iconUrl: ""
    scopes: ["openid", "email", "profile", "groups"]
    requiredLoginGroups: []
    requiredAdminGroups: []
    groupMapping: {}
  storage:
    type: memory
  oauth2:
    responseTypes:
      - code
    skipApprovalScreen: true
    alwaysShowLoginScreen: true
  connectors: []
  enablePasswordDB: false
  staticPasswords: []
  extraConfig: {}
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  # Pod securityContext for Dex. Empty falls back to the global podSecurityContext, then to
  # runAsNonRoot as the image's user 1001 (runAsUser/runAsGroup/fsGroup 1001), seccomp
  # RuntimeDefault.
  podSecurityContext: {}
  # Container securityContext for Dex. Empty falls back to the global securityContext, then to
  # the hardened default (read-only root filesystem; /tmp is an emptyDir).
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []

# Database configuration for either bundled or external PostgreSQL.
database:
  local:
    enabled: true
    # The Postgres password: existingSecret (with createSecret: false; key POSTGRES_PASSWORD),
    # externalSecret, password (with createSecret: true), devSecrets.seed, or (DEPRECATED default
    # with createSecret: true and nothing else) lookup + random into <fullname>-psql.
    # createSecret: false without existingSecret/externalSecret fails rendering.
    createSecret: true
    existingSecret: ""
    username: ccf
    database: ccf
    password: ""
    # External Secrets Operator generates <fullname>-psql (key POSTGRES_PASSWORD) once.
    externalSecret:
      enabled: false
    vpa:
      enabled: false
      updatePolicy:
        updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
      resourcePolicy:
        containerPolicy:
          mode: Auto # @schema enum:[Off, Auto]
          controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
          minAllowed:
            cpu: 100m
            memory: 128Mi
          maxAllowed:
            cpu: 512m
            memory: 512Mi
      recommenders: []
    image:
      repository: postgres
      tag: 17.5
      pullPolicy: IfNotPresent
    persistence:
      createPersistentVolume: true # Set false when using a dynamic storageClass (e.g., ebs-gp3)
      existingVolume: ""
      size: 10Gi
      mountPath: "/var/lib/postgresql/data"
      storageClass: "standard"
      volumeMode: Filesystem
      accessModes:
        - ReadWriteOnce
      reclaimPolicy: Delete
      path: "/var/lib/ccf-postgresql"
      nodeAffinity: {}
    resources: {}
    extraEnv: []
    # Pod securityContext for PostgreSQL. Empty falls back to the global podSecurityContext,
    # then to runAsNonRoot as the image's postgres user (runAsUser/runAsGroup/fsGroup 999),
    # seccomp RuntimeDefault.
    podSecurityContext: {}
    # Container securityContext for PostgreSQL. Empty falls back to the global securityContext,
    # then to the hardened default (read-only root filesystem; /var/run/postgresql and /tmp are
    # emptyDirs; data on the persistent volume).
    securityContext: {}
    # Init container that chowns the data volume's root to the postgres user before it starts.
    # It is the only root container of the chart (CHOWN and FOWNER only, read-only root
    # filesystem). Needed for volumes without fsGroup support, such as the chart's hostPath PV.
    # Disable it when the volume root is already owned by uid 999 (for example a volume created
    # by an earlier release of this chart) for a pod that meets the Pod Security "restricted"
    # profile.
    volumePermissions:
      enabled: true
      user: 999
  external:
    secretRef: ""
    hostname: ""
    host: ""
    port: 5432
    existingSecret: ""
    username: ""
    database: ""
    usernameKey: username
    passwordKey: password
    databaseKey: database

# Extra Kubernetes objects to deploy alongside the chart.
# Each entry is rendered as a full manifest via tpl, so templating is supported.
# Example:
#   extraObjects:
#     - apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: my-extra-config
#       data:
#         key: value
extraObjects: []

pgadmin4:
  enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 512m
          memory: 512Mi
    recommenders: []
  image:
    repository: dpage/pgadmin4
    pullPolicy: IfNotPresent
    tag: "latest"
  # pgAdmin listens on this port (PGADMIN_LISTEN_PORT). An unprivileged port, so it runs without
  # the bind capability; the Service targets it by name.
  containerPort: 8080
  pgadmin4_default_email: admin@example.com
  pgadmin4_default_password: ""
  extraEnv: []
  extraEnvFrom: []
  labels: {}
  service:
    enabled: true
    type: ClusterIP
    port: 8001
    targetPort: http
    annotations: {}
    labels: {}
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  podLabels: {}
  podAnnotations: {}
  resources: {}
  # Pod securityContext for pgAdmin. Empty falls back to the global podSecurityContext, then to
  # runAsNonRoot as the image's pgadmin user (runAsUser/runAsGroup/fsGroup 5050), seccomp
  # RuntimeDefault.
  podSecurityContext: {}
  # Container securityContext for pgAdmin. Empty falls back to the global securityContext, then
  # to the hardened default (read-only root filesystem; /var/lib/pgadmin, /run/pgadmin and /tmp
  # are emptyDirs).
  securityContext: {}
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

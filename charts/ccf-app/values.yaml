# Default values for ccf-app.
# This file is YAML-formatted. Declare variables to be passed into your templates.

# Labels defined here are merged into every rendered object.
commonLabels: {}

# Pod-level metadata applied to all workloads unless overridden per component.
podAnnotations: {}
podLabels: {}

# Secrets for pulling an image from a private repository.
imagePullSecrets: []

# Override chart name and fullname helpers.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials.
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# Pod security context shared by all workloads.
podSecurityContext: {}

# Container security context shared by all workloads unless overridden per component.
securityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Global ingress settings that apply to every component ingress rule.
ingress:
  enabled: true
  className: ""
  annotations: {}
  labels: {}
  tls: []

api:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
    recommenders: []
  image:
    repository: ghcr.io/compliance-framework/api
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.4.7"
  containerPort: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: http
    annotations: {}
    labels: {}
  livenessProbe:
    httpGet:
      path: /api/auth/publickey
      port: http
  readinessProbe:
    httpGet:
      path: /api/auth/publickey
      port: http
  corsOrigins:
    - https://ccf.example.com
  user:
    username: admin@localhost
    email: admin@localhost
    password: ""
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf-api.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

ui:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 10m
          memory: 10Mi
        maxAllowed:
          cpu: 128m
          memory: 200Mi
    recommenders: []
  image:
    repository: ghcr.io/compliance-framework/ui
    pullPolicy: IfNotPresent
    tag: "2.0.7"
  containerPort: 80
  service:
    enabled: true
    type: ClusterIP
    port: 8000
    targetPort: http
    annotations: {}
    labels: {}
  apiUrl: "https://ccf-api.example.com"
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  labels: {}
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  extraEnv: []
  extraEnvFrom: []
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

# Database configuration for either bundled or external PostgreSQL.
database:
  local:
    enabled: true
    username: ccf
    database: ccf
    password: ""
    vpa:
      enabled: false
      updatePolicy:
        updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
      resourcePolicy:
        containerPolicy:
          mode: Auto # @schema enum:[Off, Auto]
          controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
          minAllowed:
            cpu: 10m
            memory: 64Mi
          maxAllowed:
            cpu: 500m
            memory: 512Mi
      recommenders: []
    image:
      repository: postgres
      tag: 17.5
      pullPolicy: IfNotPresent
    persistence:
      createPersistentVolume: true # Set false when using a dynamic storageClass (e.g., ebs-gp3)
      existingVolume: ""
      size: 10Gi
      storageClass: "standard"
      volumeMode: Filesystem
      accessModes:
        - ReadWriteOnce
      reclaimPolicy: Delete
      path: "/var/lib/ccf-postgresql"
      nodeAffinity: {}
    resources: {}
  external:
    secretRef: ""
    hostname: ""
    host: ""
    port: 5432
    existingSecret: ""
    username: ""
    database: ""
    usernameKey: username
    passwordKey: password
    databaseKey: database

pgadmin4:
  enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  vpa:
    enabled: false
    updatePolicy:
      updateMode: "Recreate" # @schema enum:[Off, Auto, Initial, Recreate, InPlaceOrRecreate]
    resourcePolicy:
      containerPolicy:
        mode: Auto # @schema enum:[Off, Auto]
        controlledValues: RequestsAndLimits # @schema enum:[RequestsOnly, RequestsAndLimits]
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
    recommenders: []
  image:
    repository: dpage/pgadmin4
    pullPolicy: IfNotPresent
    tag: "latest"
  containerPort: 80
  pgadmin4_default_email: admin@example.com
  pgadmin4_default_password: ""
  extraEnv: []
  extraEnvFrom: []
  labels: {}
  service:
    enabled: true
    type: ClusterIP
    port: 8001
    targetPort: http
    annotations: {}
    labels: {}
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  podLabels: {}
  podAnnotations: {}
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  ingress:
    enabled: true
    labels: {}
    annotations: {}
    hosts:
      - host: ccf.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific

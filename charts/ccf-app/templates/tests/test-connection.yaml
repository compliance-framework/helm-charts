{{- if and .Values.ui.enabled .Values.ui.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ccf-app.fullname" . }}-test-connection"
  labels:
    {{- include "ccf-app.componentMetadataLabels" (dict "root" . "name" "ui" "component" .Values.ui) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "ccf-app.fullname" . }}-ui:{{ .Values.ui.service.port }}']
  restartPolicy: Never
{{- end }}

{{- /*
ExternalSecrets for the credentials the operator asked External Secrets Operator to generate.
Each one is created once (refreshPolicy CreatedOnce), so a password never changes under a
running database. The generated Secrets keep the names the chart used to create itself.
*/ -}}
{{- $fullname := include "ccf-app.fullname" . }}
{{- $eso := default (dict) .Values.externalSecrets }}
{{- if and .Values.database.local.enabled (eq (include "ccf-app.psqlPasswordSource" .) "externalSecret") }}
---
{{ include "ccf-app.passwordExternalSecret" (dict "root" . "name" (printf "%s-psql" $fullname) "key" "POSTGRES_PASSWORD") }}
{{- end }}
{{- if eq (include "ccf-app.initialUserPasswordSource" .) "externalSecret" }}
---
{{ include "ccf-app.passwordExternalSecret" (dict "root" . "name" (printf "%s-initial-user-password" $fullname) "key" "password") }}
{{- end }}
{{- if and .Values.dex.enabled (eq (include "ccf-app.dexClientSecretSource" .) "externalSecret") }}
---
{{ include "ccf-app.passwordExternalSecret" (dict "root" . "name" (printf "%s-dex" $fullname) "key" (include "ccf-app.dexClientSecretKey" .)) }}
{{- end }}
{{- if and .Values.api.enabled (eq (toString .Values.api.jwt.source) "externalSecret") }}
{{- /*
No ESO generator emits an RSA private key the API can read: the SSHKey generator writes
OpenSSH format, and the API needs PKCS#1/PKCS#8 PEM. ESO templates include sprig's
genPrivateKey, which writes a PKCS#1 "RSA PRIVATE KEY" PEM, so the key is made by the
template. A Password generator is the (unused) data source the ExternalSecret needs.
*/}}
---
apiVersion: {{ default "generators.external-secrets.io/v1alpha1" $eso.generatorApiVersion }}
kind: Password
metadata:
  name: {{ $fullname }}-jwt-private-key
  labels:
    {{- include "ccf-app.labels" . | nindent 4 }}
spec:
  length: 16
  allowRepeat: true
---
apiVersion: {{ default "external-secrets.io/v1" $eso.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-jwt-private-key
  labels:
    {{- include "ccf-app.labels" . | nindent 4 }}
spec:
  refreshPolicy: {{ default "CreatedOnce" $eso.refreshPolicy }}
  target:
    name: {{ $fullname }}-jwt-private-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        private_key.pem: {{ "{{ genPrivateKey \"rsa\" }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: {{ default "generators.external-secrets.io/v1alpha1" $eso.generatorApiVersion }}
          kind: Password
          name: {{ $fullname }}-jwt-private-key
{{- end }}

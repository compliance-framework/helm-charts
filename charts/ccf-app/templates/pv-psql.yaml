{{- if .Values.database.local.enabled }}
{{- if not .Values.database.local.persistence.existingVolume }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "ccf-app.fullname" . }}-postgresql
  labels:
    {{- include "ccf-app.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.database.local.persistence.size | default "10Gi" }}
  volumeMode: {{ .Values.database.local.persistence.volumeMode | default "Filesystem" }}
  accessModes:
    {{- range $mode := (.Values.database.local.persistence.accessModes | default (list "ReadWriteOnce")) }}
    - {{ $mode }}
    {{- end }}
  persistentVolumeReclaimPolicy: {{ .Values.database.local.persistence.reclaimPolicy | default "Delete" }}
  {{- with .Values.database.local.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  hostPath:
    path: {{ .Values.database.local.persistence.path | default "/var/lib/ccf-postgresql" | quote }}
    type: DirectoryOrCreate
  {{- with .Values.database.local.persistence.nodeAffinity }}
  nodeAffinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

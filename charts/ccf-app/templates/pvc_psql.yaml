{{- if .Values.database.local.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ccf-app.fullname" . }}-postgresql
  labels:
    {{- include "ccf-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.database.local.persistence.existingClaim }}
  {{- with .Values.database.local.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  accessModes:
    {{- range $mode := (.Values.database.local.persistence.accessModes | default (list "ReadWriteOnce")) }}
    - {{ $mode }}
    {{- end }}
  volumeMode: {{ .Values.database.local.persistence.volumeMode | default "Filesystem" }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.local.persistence.size | default "10Gi" }}
  {{- if .Values.database.local.persistence.existingVolume }}
  volumeName: {{ .Values.database.local.persistence.existingVolume }}
  {{- else if and (not .Values.database.local.persistence.existingClaim) (ne (toString .Values.database.local.persistence.createPersistentVolume) "false") }}
  volumeName: {{ include "ccf-app.fullname" . }}-postgresql
  {{- end }}
{{- end }}

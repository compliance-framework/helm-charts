{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccf-app.fullname" . }}-ui
  labels:
    {{- include "ccf-app.componentMetadataLabels" (dict "root" . "name" "ui" "component" .Values.ui) | nindent 4 }}
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ccf-app.componentBaseLabels" (dict "root" . "name" "ui") | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := merge (dict) (default (dict) .Values.podAnnotations) }}
      {{- $podAnnotations = merge $podAnnotations (default (dict) .Values.ui.podAnnotations) }}
      {{- $_ := set $podAnnotations "checksum/config" (include (print $.Template.BasePath "/configmap_ui.yaml") . | sha256sum) }}
      {{- $_ := set $podAnnotations "checksum/nginx" (include (print $.Template.BasePath "/configmap_ui_nginx.yaml") . | sha256sum) }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "ccf-app.componentPodLabels" (dict "root" . "name" "ui" "component" .Values.ui) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ccf-app.serviceAccountName" . }}
      securityContext:
        {{- include "ccf-app.uiPodSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-ui
          securityContext:
            {{- include "ccf-app.uiSecurityContext" . | nindent 12 }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          env:
            - name: API_URL
              value: {{ include "ccf-app.uiApiUrl" . | quote }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # nginx writes its caches, its pid file and temp files; the root filesystem is read-only.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "ccf-app.fullname" . }}-ui
            items:
            - key: config.json
              path: config.json
        - name: nginx-config
          configMap:
            name: {{ include "ccf-app.fullname" . }}-ui-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

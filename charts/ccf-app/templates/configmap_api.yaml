{{- if .Values.api.enabled }}
{{- $jwt := include "ccf-app.jwtRuntimeConfig" . | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ccf-app.fullname" . }}-api
  labels:
    {{- include "ccf-app.componentMetadataLabels" (dict "root" . "name" "api" "component" .Values.api) | nindent 4 }}
data:
  APP_PORT: "{{ .Values.api.service.port }}"
  CCF_DB_DRIVER: "postgres"
  CCF_DB_HOST: {{ if .Values.database.local.enabled }}"{{ include "ccf-app.fullname" . }}-postgresql"{{ else }}"{{ coalesce .Values.database.external.host .Values.database.external.hostname }}"{{ end }}
  CCF_DB_PORT: "{{ if .Values.database.local.enabled }}5432{{ else }}{{ .Values.database.external.port }}{{ end }}"
  CCF_DB_NAME: "{{ if .Values.database.local.enabled }}{{ .Values.database.local.database }}{{ else }}{{ .Values.database.external.database }}{{ end }}"
  CCF_DB_USER: "{{ if .Values.database.local.enabled }}{{ .Values.database.local.username }}{{ else }}{{ .Values.database.external.username }}{{ end }}"
  {{- if not $jwt.inMemory }}
  CCF_JWT_PRIVATE_KEY: "/var/ccf/private_key/private_key.pem"
  CCF_JWT_PUBLIC_KEY: "/var/ccf/public_key/public_key.pem"
  {{- end }}
  CCF_WEB_BASE_URL: {{ include "ccf-app.apiWebBaseUrl" . | quote }}
  CCF_ENVIRONMENT: {{ .Values.api.environment | default "production" | quote }}
  CCF_API_ALLOWED_ORIGINS: {{ include "ccf-app.apiCorsOrigins" . | quote }}
  {{- range $key, $val := .Values.api.extraConfig }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- if or .Values.api.sso.enabled .Values.dex.enabled }}
  CCF_SSO_CONFIG: "/etc/ccf/sso.yaml"
  {{- end }}
  {{- if .Values.api.email.enabled }}
  CCF_EMAIL_CONFIG: "/etc/ccf/email.yaml"
  {{- end }}
  {{- if .Values.api.workflow.enabled }}
  CCF_WORKFLOW_CONFIG: "/etc/ccf/workflow.yaml"
  {{- end }}
  {{- if .Values.api.slack.enabled }}
  CCF_SLACK_CONFIG: "/etc/ccf/slack.yaml"
  {{- end }}
  {{- if .Values.api.ai.enabled }}
  {{- if and (not .Values.api.ai.existingSecret) (not .Values.api.ai.apiKey) }}
  {{- fail "api.ai.apiKey is required when api.ai.enabled is true (unless api.ai.existingSecret is set)" }}
  {{- end }}
  CCF_AI_ENABLED: "true"
  CCF_AI_PROVIDER: {{ .Values.api.ai.provider | quote }}
  CCF_AI_MODEL: {{ .Values.api.ai.model | quote }}
  CCF_AI_REQUEST_TIMEOUT: {{ .Values.api.ai.requestTimeout | quote }}
  CCF_AI_MAX_CONTROLS_PER_CHUNK: {{ .Values.api.ai.maxControlsPerChunk | quote }}
  CCF_AI_MAX_LABEL_SETS_PER_CHUNK: {{ .Values.api.ai.maxLabelSetsPerChunk | quote }}
  CCF_AI_QUEUE_WORKERS: {{ .Values.api.ai.queueWorkers | quote }}
  CCF_AI_MAX_CALLS_PER_RUN: {{ .Values.api.ai.maxCallsPerRun | quote }}
  CCF_AI_MAX_SUGGESTIONS_PER_RUN: {{ .Values.api.ai.maxSuggestionsPerRun | quote }}
  {{- end }}
  CCF_AUTHZ_DRIVER: {{ .Values.api.authz.driver | default "builtin" | quote }}
  CCF_AUTHZ_FAIL_MODE: {{ .Values.api.authz.failMode | default "closed" | quote }}
  CCF_AUTHZ_ROLE_ASSIGNMENTS: "/etc/ccf/authz-roles.yaml"
  {{- if .Values.api.authz.cedar.policyDir }}
  CCF_AUTHZ_CEDAR_POLICY_DIR: {{ .Values.api.authz.cedar.policyDir | quote }}
  {{- end }}
{{- end }}

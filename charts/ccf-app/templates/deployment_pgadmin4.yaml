{{- if .Values.pgadmin4.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccf-app.fullname" . }}-pgadmin4
  labels:
    {{- include "ccf-app.componentMetadataLabels" (dict "root" . "name" "pgadmin4" "component" .Values.pgadmin4) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ccf-app.componentBaseLabels" (dict "root" . "name" "pgadmin4") | nindent 6 }}
  template:
    metadata:
      {{- $annotations := merge (dict) (default (dict) .Values.podAnnotations) (default (dict) .Values.api.podAnnotations) }}
      {{- if $annotations }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ccf-app.componentPodLabels" (dict "root" . "name" "pgadmin4" "component" .Values.pgadmin4) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ccf-app.serviceAccountName" . }}
      securityContext:
        {{- include "ccf-app.pgadmin4PodSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-pgadmin4
          securityContext:
            {{- include "ccf-app.pgadmin4SecurityContext" . | nindent 12 }}
          image: "{{ .Values.pgadmin4.image.repository }}:{{ .Values.pgadmin4.image.tag }}"
          imagePullPolicy: {{ .Values.pgadmin4.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.pgadmin4.containerPort }}
              protocol: TCP
          env:
            - name: PGADMIN_LISTEN_PORT
              value: {{ .Values.pgadmin4.containerPort | quote }}
            # Keep the generated config out of /pgadmin4, so the root filesystem can be read-only.
            - name: PGADMIN_CUSTOM_CONFIG_DISTRO_FILE
              value: /var/lib/pgadmin/config_distro.py
            - name: PGADMIN_DEFAULT_EMAIL
              value: {{ .Values.pgadmin4.pgadmin4_default_email | quote }}
            - name: PGADMIN_DEFAULT_PASSWORD
              value: {{ .Values.pgadmin4.pgadmin4_default_password | quote }}
            {{- with .Values.pgadmin4.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.pgadmin4.extraEnvFrom }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
            - name: pgadmin-run
              mountPath: /run/pgadmin
            - name: tmp
              mountPath: /tmp
          {{- with .Values.pgadmin4.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: pgadmin-data
          emptyDir: {}
        - name: pgadmin-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

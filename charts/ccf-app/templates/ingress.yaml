{{- $apiIngressEnabled := and .Values.api.enabled .Values.api.service.enabled .Values.api.ingress.enabled -}}
{{- $uiIngressEnabled := and .Values.ui.enabled .Values.ui.service.enabled .Values.ui.ingress.enabled -}}
{{- $dexIngressEnabled := and .Values.dex.enabled .Values.dex.service.enabled .Values.dex.ingress.enabled -}}
{{- $pgadmin4IngressEnabled := and .Values.pgadmin4.enabled .Values.pgadmin4.service.enabled .Values.pgadmin4.ingress.enabled -}}
{{- $apiIngressHosts := list -}}
{{- if $apiIngressEnabled -}}
{{- $apiIngressHosts = .Values.api.ingress.hosts -}}
{{- $apiWebBaseHost := include "ccf-app.urlHost" (include "ccf-app.apiWebBaseUrl" .) -}}
{{- if and $apiIngressEnabled (not $apiIngressHosts) $apiWebBaseHost -}}
{{- $apiIngressHosts = list (dict "host" $apiWebBaseHost "paths" (list (dict "path" (include "ccf-app.apiIngressDefaultPath" .) "pathType" "ImplementationSpecific"))) -}}
{{- end -}}
{{- end -}}
{{- $uiIngressHosts := list -}}
{{- if $uiIngressEnabled -}}
{{- $uiIngressHosts = .Values.ui.ingress.hosts -}}
{{- $webBaseHost := include "ccf-app.webBaseHost" . -}}
{{- if and $uiIngressEnabled (not $uiIngressHosts) $webBaseHost -}}
{{- $uiIngressHosts = list (dict "host" $webBaseHost "paths" (list (dict "path" "/" "pathType" "ImplementationSpecific"))) -}}
{{- end -}}
{{- end -}}
{{- $dexIngressHosts := list -}}
{{- if $dexIngressEnabled -}}
{{- $dexIngressHosts = .Values.dex.ingress.hosts -}}
{{- $dexIssuerHost := include "ccf-app.urlHost" (include "ccf-app.dexIssuerUrl" .) -}}
{{- if and $dexIngressEnabled (not $dexIngressHosts) $dexIssuerHost -}}
{{- $dexIngressHosts = list (dict "host" $dexIssuerHost "paths" (list (dict "path" (include "ccf-app.dexIngressDefaultPath" .) "pathType" "Prefix"))) -}}
{{- end -}}
{{- end -}}
{{- $pgadmin4IngressHosts := list -}}
{{- if $pgadmin4IngressEnabled -}}
{{- $pgadmin4IngressHosts = .Values.pgadmin4.ingress.hosts -}}
{{- end -}}
{{- if and .Values.ingress.enabled (or $apiIngressHosts $uiIngressHosts $dexIngressHosts $pgadmin4IngressHosts) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ccf-app.fullname" . }}
  labels:
    {{- include "ccf-app.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annotations := merge (dict) (default (dict) .Values.ingress.annotations) -}}
  {{- if $apiIngressEnabled }}
  {{- $annotations = merge $annotations (default (dict) .Values.api.ingress.annotations) -}}
  {{- end }}
  {{- if $uiIngressEnabled }}
  {{- $annotations = merge $annotations (default (dict) .Values.ui.ingress.annotations) -}}
  {{- end }}
  {{- if $dexIngressEnabled }}
  {{- $annotations = merge $annotations (default (dict) .Values.dex.ingress.annotations) -}}
  {{- end }}
  {{- if $pgadmin4IngressEnabled }}
  {{- $annotations = merge $annotations (default (dict) .Values.pgadmin4.ingress.annotations) -}}
  {{- end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if $apiIngressEnabled }}
    {{- range $apiIngressHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                {{- $defaultName := printf "%s-api" (include "ccf-app.fullname" $) -}}
                {{- $serviceName := $defaultName -}}
                {{- $servicePort := $.Values.api.service.port -}}
                {{- if .service }}
                  {{- if .service.name }}
                    {{- $serviceName = .service.name -}}
                  {{- else if .service.shortName }}
                    {{- $serviceName = printf "%s-%s" (include "ccf-app.fullname" $) .service.shortName -}}
                  {{- end }}
                  {{- if .service.port }}
                    {{- $servicePort = .service.port -}}
                  {{- end }}
                {{- end }}
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePort }}
          {{- end }}
    {{- end }}
    {{- end }}
    {{- if $uiIngressEnabled }}
    {{- range $uiIngressHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                {{- $defaultName := printf "%s-ui" (include "ccf-app.fullname" $) -}}
                {{- $serviceName := $defaultName -}}
                {{- $servicePort := $.Values.ui.service.port -}}
                {{- if .service }}
                  {{- if .service.name }}
                    {{- $serviceName = .service.name -}}
                  {{- else if .service.shortName }}
                    {{- $serviceName = printf "%s-%s" (include "ccf-app.fullname" $) .service.shortName -}}
                  {{- end }}
                  {{- if .service.port }}
                    {{- $servicePort = .service.port -}}
                  {{- end }}
                {{- end }}
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePort }}
          {{- end }}
    {{- end }}
    {{- end }}
    {{- if $dexIngressEnabled }}
    {{- range $dexIngressHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                {{- $defaultName := printf "%s-dex" (include "ccf-app.fullname" $) -}}
                {{- $serviceName := $defaultName -}}
                {{- $servicePort := $.Values.dex.service.port -}}
                {{- if .service }}
                  {{- if .service.name }}
                    {{- $serviceName = .service.name -}}
                  {{- else if .service.shortName }}
                    {{- $serviceName = printf "%s-%s" (include "ccf-app.fullname" $) .service.shortName -}}
                  {{- end }}
                  {{- if .service.port }}
                    {{- $servicePort = .service.port -}}
                  {{- end }}
                {{- end }}
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePort }}
          {{- end }}
    {{- end }}
    {{- end }}
    {{- if $pgadmin4IngressEnabled }}
    {{- range $pgadmin4IngressHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                {{- $defaultName := printf "%s-pgadmin4" (include "ccf-app.fullname" $) -}}
                {{- $serviceName := $defaultName -}}
                {{- $servicePort := $.Values.pgadmin4.service.port -}}
                {{- if .service }}
                  {{- if .service.name }}
                    {{- $serviceName = .service.name -}}
                  {{- else if .service.shortName }}
                    {{- $serviceName = printf "%s-%s" (include "ccf-app.fullname" $) .service.shortName -}}
                  {{- end }}
                  {{- if .service.port }}
                    {{- $servicePort = .service.port -}}
                  {{- end }}
                {{- end }}
                name: {{ $serviceName }}
                port:
                  number: {{ $servicePort }}
          {{- end }}
    {{- end }}
    {{- end }}
{{- end }}

{{- if has (include "ccf-app.initialUserPasswordSource" .) (list "value" "seed" "generated") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccf-app.fullname" . }}-initial-user-password
type: Opaque
data:
  password: {{ include "ccf-app.initialUserPasswordB64" . }}
{{- end }}
{{- if and .Values.api.enabled (eq (toString .Values.api.jwt.source) "generated") }}
{{- /* DEPRECATED api.jwt.source=generated (the default): see _deprecated_generated.tpl. */}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccf-app.fullname" . }}-jwt-private-key
type: Opaque
data:
  private_key.pem: {{ include "ccf-app.deprecated.jwtPrivateKeyB64" . }}
{{- end }}

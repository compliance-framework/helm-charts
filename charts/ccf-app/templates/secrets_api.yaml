{{- if has (include "ccf-app.initialUserPasswordSource" .) (list "value" "seed") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccf-app.fullname" . }}-initial-user-password
type: Opaque
data:
  password: {{ include "ccf-app.initialUserPassword" . | b64enc }}
{{- end }}
{{- if and .Values.api.enabled (eq (toString .Values.api.jwt.source) "generated") }}
{{- /*
DEPRECATED api.jwt.source=generated: the one place the chart generates a value at render time.
There is no lookup, so the key is new on every render: every helm upgrade and every GitOps sync
rotates it (logging everyone out, invalidating agent tokens). Kept for 0.8.x installs; it will
be removed. ci/argocd/check.sh allows genPrivateKey only here and in the ESO template literal.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccf-app.fullname" . }}-jwt-private-key
type: Opaque
data:
  private_key.pem: {{ genPrivateKey "rsa" | b64enc }}
{{- end }}

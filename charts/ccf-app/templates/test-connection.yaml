{{- if and .Values.ui.enabled .Values.ui.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ccf-app.fullname" . }}-test-connection"
  labels:
    {{- include "ccf-app.componentMetadataLabels" (dict "root" . "name" "ui" "component" .Values.ui) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    {{- include "ccf-app.testPodSecurityContext" . | nindent 4 }}
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-O', '/dev/null', '{{ include "ccf-app.fullname" . }}-ui:{{ .Values.ui.service.port }}/config.json']
      securityContext:
        {{- include "ccf-app.hardenedContainerDefaults" . | nindent 8 }}
  restartPolicy: Never
{{- end }}

# Default values for ccf-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of agent replicas. Every replica runs the same config (and key), so replicas
# write the same evidence streams and each one runs every plugin.
replicaCount: 1

# Deployment update strategy. Recreate stops the old pod before the new one starts, so two
# pods of one release never run plugins side by side during a rollout.
strategy:
  type: Recreate  # @schema enum:[Recreate, RollingUpdate]

# Seconds Kubernetes waits after SIGTERM before killing the pod. The agent takes up to 30s
# to stop its schedules and plugins on SIGTERM, so keep this above 30.
terminationGracePeriodSeconds: 45  # @schema type:integer;minimum:0

image:
  repository: ghcr.io/compliance-framework/agent
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Defaults meet Pod Security "restricted": non-root numeric user, seccomp RuntimeDefault, no
# privilege escalation, all capabilities dropped, read-only root filesystem (the agent writes to
# the /tmp and /app/.compliance-framework emptyDirs). For agent-custodian, use uid/gid 1001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness and readiness probes
livenessProbe:
  enabled: false
  # The agent doesn't expose health endpoints by default
  # exec:
  #   command:
  #   - /bin/sh
  #   - -c
  #   - pgrep -f agent

readinessProbe:
  enabled: false

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Init containers to run before the agent container starts.
initContainers: []
# - name: plugin-sidecar
#   image: my-plugin-sidecar:latest
#   command: ["sh", "-c", "cp -rv /plugins/* /output/"]
#   volumeMounts:
#     - name: plugins
#       mountPath: /output

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Agent configuration
agent:
  # Deprecated, no effect: rendered as the HOSTNAME env var, which the agent never reads (it
  # uses the pod's hostname, i.e. the pod name). Will be removed in a future release.
  hostname: ""

  # Agent daemon mode. true runs the plugins on their schedules continuously. false runs
  # every plugin once and exits, and the pod then restarts (restartPolicy Always), so each
  # run registers as a new one-shot agent instance in the API.
  daemon: true

  # Optional fixed agent instance ID (CCF_INSTANCE_ID), a UUID. Unset by default: the agent
  # generates one and keeps it in its state directory (CCF_STATE_DIR, pinned by the chart to
  # /app/.compliance-framework/state/agent on an emptyDir), so each new pod is a new instance.
  # The chart never generates one. Do not share one ID between replicas.
  instanceId: ""  # @schema pattern:^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$

  # Verbosity level (0-3)
  verbosity: 0

  # Agent evidence configuration
  agentEvidence:
    # enables sending agent execution evidence to the API
    enabled: false
    # interval to send agent execution evidence
    interval: "1h"
    # Emit agent evidence as soon as a run completes (and on startup failures), in addition
    # to the interval. null leaves the agent default (true).
    emitOnRunCompletion: null  # @schema type:[boolean, null]

  # Remote configuration (the agent's remote_config block). The chart renders only the keys
  # that are set; with nothing set, no block is rendered and the agent defaults apply: mode
  # "report" with API credentials, "off" without (no credentials always forces "off").
  # remote_config can only be set locally (here), never by a remote overlay.
  remoteConfig:
    # off | report | apply_safe | apply_all. Quote "off": unquoted YAML off is a boolean.
    # report sends configuration reports but never fetches; apply_safe and apply_all fetch
    # the overlay stored in the API and apply it.
    mode: ""  # @schema enum:["","off","report","apply_safe","apply_all"]
    # How often to poll for a new overlay, a Go duration of at least 15s (agent default 60s).
    pollInterval: ""  # @schema pattern:^$|^([0-9]*[.]?[0-9]+(ns|us|µs|ms|s|m|h))+$
    # Globs (path.Match) of plugin and policy sources an overlay may introduce as safe changes,
    # e.g. ghcr.io/compliance-framework/*.
    trustedSources: []  # @schema item:string
    # plugins.*.config keys an overlay may change as safe changes: "key", "plugin:key" or "*".
    overridableConfigFlags: []  # @schema item:string
    # Allow an overlay to introduce local plugin/policy paths (only with mode apply_all).
    # null leaves the agent default (false).
    allowLocalSources: null  # @schema type:[boolean, null]

  # API configuration
  api:
    # URL of the CCF API server
    url: "http://ccf-api:8080"
    # Agent service-account credentials (an agent key created in the CCF API under
    # Admin -> Agents, or by the ccf-app agent bootstrap Job). They reach the agent as
    # CCF_API_AUTH_CLIENT_ID / CCF_API_AUTH_CLIENT_SECRET. Set both or neither: without
    # credentials the agent runs anonymously.
    auth:
      enabled: false
      # createSecret: If true, a secret <fullname>-auth is created from clientId.value and
      # clientSecret.value, with the keys CCF_API_AUTH_CLIENT_ID and CCF_API_AUTH_CLIENT_SECRET.
      createSecret: false
      # existingSecret: If provided, the credentials are read from this secret. Its keys default
      # to CCF_API_AUTH_CLIENT_ID and CCF_API_AUTH_CLIENT_SECRET (the keys the ccf-app agent
      # bootstrap Job writes); clientId.secretKeyRef / clientSecret.secretKeyRef override them.
      existingSecret: ""
      # Client ID for authentication (a UUID)
      clientId:
        value: ""  # @schema pattern:^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        secretKeyRef: ""  # key in existingSecret; defaults to CCF_API_AUTH_CLIENT_ID
      # Client secret for authentication (should be in secret for production)
      clientSecret:
        value: ""  # if set, we use this value
        secretKeyRef: ""  # key in existingSecret; defaults to CCF_API_AUTH_CLIENT_SECRET
  # Plugin configurations
  # Each plugin can have: schedule, source, policies, config, labels
  # Example:
  #   jira:
  #     schedule: "*/5 * * * *"
  #     source: ghcr.io/compliance-framework/plugin-jira:v0.1.1
  #     policies:
  #       - ghcr.io/compliance-framework/plugin-jira-policies:v0.1.1
  #     config:
  #       base_url: https://your-instance.atlassian.net
  #       auth_type: oauth2
  #     labels:
  #       tier: change-management
  #       team: ccf
  # @schema
  # description: Plugin configurations - map of plugin name to plugin configuration
  # additionalProperties:
  #   type: object
  #   properties:
  #     schedule:
  #       type: string
  #       description: Cron schedule for plugin execution
  #       examples: ["*/5 * * * *", "0 */2 * * *"]
  #     source:
  #       type: string
  #       description: Container image for the plugin
  #     policies:
  #       type: array
  #       description: List of policy bundles to evaluate
  #       items:
  #         type: string
  #     config:
  #       type: object
  #       description: Plugin-specific configuration
  #     labels:
  #       type: object
  #       description: Labels for organizing compliance data
  #       additionalProperties:
  #         type: string
  # @schema
  plugins: {}

# Secret references for plugin credentials
# These will be mounted as environment variables
# Example:
#   - name: ccf-plugin-jira
#     keys:
#       - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
#         secretKey: client_id
#       - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_SECRET
#         secretKey: client_secret
# @schema
# description: Secret references for plugin credentials mounted as environment variables
# items:
#   type: object
#   required: [name, keys]
#   properties:
#     name:
#       type: string
#       description: Name of the Kubernetes secret
#     keys:
#       type: array
#       description: List of secret keys to mount as environment variables
#       items:
#         type: object
#         required: [envName, secretKey]
#         properties:
#           envName:
#             type: string
#             description: Environment variable name
#             pattern: ^[A-Z_][A-Z0-9_]*$
#           secretKey:
#             type: string
#             description: Key in the secret
# @schema
secretRefs: []

# Additional environment variables
extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# Additional environment variables from ConfigMaps or Secrets
extraEnvFrom: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: my-secret

# Restart policy for the agent
restartPolicy: Always

# Extra Kubernetes objects to deploy alongside the chart.
# Each entry is rendered as a full manifest via tpl, so templating is supported.
# Example:
#   extraObjects:
#     - apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: my-extra-config
#       data:
#         key: value
extraObjects: []

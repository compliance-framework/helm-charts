{{- include "ccf-agent.validateAuthConfig" . }}
{{- include "ccf-agent.validateInstanceId" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccf-agent.fullname" . }}
  labels:
    {{- include "ccf-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
    {{- if and (eq (toString .type) "Recreate") (not (hasKey . "rollingUpdate")) }}
    {{- /* Clears the rollingUpdate block the API server defaulted while the Deployment was
    RollingUpdate, so an upgrade from an older chart can switch to Recreate. */}}
    rollingUpdate: null
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ccf-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ccf-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ccf-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - "./concom"
          - "agent"
          - "-c"
          - "/config/config.yml"
        env:
          - name: HOSTNAME
            value: {{ include "ccf-agent.hostname" . | quote }}
          - name: CCF_STATE_DIR
            value: {{ include "ccf-agent.stateDir" . | quote }}
          {{- with .Values.agent.instanceId }}
          - name: CCF_INSTANCE_ID
            value: {{ . | quote }}
          {{- end }}
          {{- with (include "ccf-agent.authEnv" .) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- range $secretRef := .Values.secretRefs }}
          {{- range $key := $secretRef.keys }}
          - name: {{ $key.envName }}
            valueFrom:
              secretKeyRef:
                name: {{ $secretRef.name }}
                key: {{ $key.secretKey }}
          {{- end }}
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.extraEnvFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
          - name: config
            mountPath: /config
            readOnly: true
          - name: ccf-tmp
            mountPath: /app/.compliance-framework
          - name: tmp
            mountPath: /tmp
          {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ccf-agent.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        - name: ccf-tmp
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      restartPolicy: {{ .Values.restartPolicy }}

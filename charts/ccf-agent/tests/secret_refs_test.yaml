suite: secret references
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
release:
  name: ccf-agent
  namespace: default

tests:
  - it: renders without secret references by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: HOSTNAME
              value: ccf-agent
        template: templates/deployment.yaml

  - it: mounts single secret with single key
    set:
      secretRefs:
        - name: ccf-plugin-jira
          keys:
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
              secretKey: client_id
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_id
        template: templates/deployment.yaml

  - it: mounts single secret with multiple keys
    set:
      secretRefs:
        - name: ccf-plugin-jira
          keys:
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
              secretKey: client_id
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_SECRET
              secretKey: client_secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_id
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_secret
        template: templates/deployment.yaml

  - it: mounts multiple secrets with multiple keys
    set:
      secretRefs:
        - name: ccf-plugin-jira
          keys:
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
              secretKey: client_id
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_SECRET
              secretKey: client_secret
        - name: ccf-plugin-github
          keys:
            - envName: CCF_PLUGINS_GITHUB_CONFIG_TOKEN
              secretKey: github_token
            - envName: CCF_PLUGINS_DEPENDABOT_CONFIG_TOKEN
              secretKey: dependabot_token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_id
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_secret
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_GITHUB_CONFIG_TOKEN
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-github
                key: github_token
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_DEPENDABOT_CONFIG_TOKEN
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-github
                key: dependabot_token
        template: templates/deployment.yaml

  - it: combines secret refs with extra env vars
    set:
      secretRefs:
        - name: ccf-plugin-jira
          keys:
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
              secretKey: client_id
      extraEnv:
        - name: CUSTOM_VAR
          value: "custom-value"
        - name: ANOTHER_VAR
          value: "another-value"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOSTNAME
            value: ccf-agent
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_id
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: "custom-value"
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANOTHER_VAR
            value: "another-value"
        template: templates/deployment.yaml

  - it: supports extraEnvFrom for ConfigMap and Secret references
    set:
      extraEnvFrom:
        - configMapRef:
            name: my-configmap
        - secretRef:
            name: my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: my-configmap
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-secret
        template: templates/deployment.yaml

  - it: handles complex todo demo configuration
    set:
      agent:
        hostname: "todo-worker-1"
        api:
          url: "http://ccf-api:8080"
        plugins:
          jira:
            schedule: "*/2 * * * *"
            source: ghcr.io/compliance-framework/plugin-jira:v0.1.1
          dependabot:
            schedule: "*/2 * * * *"
            source: ghcr.io/compliance-framework/plugin-dependabot:v0.3.4
      secretRefs:
        - name: ccf-plugin-jira
          keys:
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
              secretKey: client_id
            - envName: CCF_PLUGINS_JIRA_CONFIG_CLIENT_SECRET
              secretKey: client_secret
        - name: ccf-plugin-github
          keys:
            - envName: CCF_PLUGINS_DEPENDABOT_CONFIG_TOKEN
              secretKey: dependabot_token
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "HOSTNAME")].value
          value: "todo-worker-1"
        template: templates/deployment.yaml
      - matchRegex:
          path: data["config.yml"]
          pattern: "url: http://ccf-api:8080"
        template: templates/configmap.yaml
      - matchRegex:
          path: data["config.yml"]
          pattern: "jira:"
        template: templates/configmap.yaml
      - matchRegex:
          path: data["config.yml"]
          pattern: "dependabot:"
        template: templates/configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_JIRA_CONFIG_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-jira
                key: client_id
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_PLUGINS_DEPENDABOT_CONFIG_TOKEN
            valueFrom:
              secretKeyRef:
                name: ccf-plugin-github
                key: dependabot_token
        template: templates/deployment.yaml

suite: render smoke
templates:
  - templates/*.yaml
release:
  name: ccf-agent
  namespace: default

tests:
  - it: renders with default values
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
        template: templates/deployment.yaml
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
        template: templates/configmap.yaml
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
        template: templates/serviceaccount.yaml
      - equal:
          path: metadata.name
          value: ccf-agent
        template: templates/deployment.yaml

  - it: renders with custom name override
    set:
      nameOverride: "custom-agent"
    asserts:
      - equal:
          path: metadata.name
          value: ccf-agent-custom-agent
        template: templates/deployment.yaml

  - it: renders with full name override
    set:
      fullnameOverride: "my-agent"
    asserts:
      - equal:
          path: metadata.name
          value: my-agent
        template: templates/deployment.yaml
      - equal:
          path: metadata.name
          value: my-agent-config
        template: templates/configmap.yaml

  - it: renders HPA when autoscaling is enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 10
      autoscaling.targetCPUUtilizationPercentage: 75
    asserts:
      - containsDocument:
          kind: HorizontalPodAutoscaler
          apiVersion: autoscaling/v2
        template: templates/hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 2
        template: templates/hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 10
        template: templates/hpa.yaml
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 75
        template: templates/hpa.yaml

  - it: does not render HPA when autoscaling is disabled
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/hpa.yaml

  - it: sets correct replica count when autoscaling is disabled
    set:
      replicaCount: 3
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        template: templates/deployment.yaml

  - it: does not set replica count when autoscaling is enabled
    set:
      replicaCount: 3
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
        template: templates/deployment.yaml

  - it: renders with custom image tag
    set:
      image.tag: "0.3.0"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ":0.3.0$"
        template: templates/deployment.yaml

  - it: uses chart appVersion when tag is empty
    set:
      image.tag: ""
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ":0.4.0$"
        template: templates/deployment.yaml

  - it: sets custom hostname
    set:
      agent.hostname: "custom-worker-1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "HOSTNAME")].value
          value: "custom-worker-1"
        template: templates/deployment.yaml

  - it: uses generated hostname when not specified
    set:
      agent.hostname: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "HOSTNAME")].value
          value: "ccf-agent"
        template: templates/deployment.yaml

  - it: creates service account when enabled
    set:
      serviceAccount.create: true
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
        template: templates/serviceaccount.yaml

  - it: does not create service account when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml

  - it: adds service account annotations
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/agent-role"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789:role/agent-role"
        template: templates/serviceaccount.yaml

  - it: sets security contexts
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: templates/deployment.yaml

  - it: mounts .compliance-framework volume for writable filesystem
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ccf-tmp
            emptyDir: {}
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ccf-tmp
            mountPath: /app/.compliance-framework
        template: templates/deployment.yaml

  - it: mounts tmp volume for writable filesystem
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
        template: templates/deployment.yaml

  - it: sets resource limits and requests
    set:
      resources.limits.cpu: "2000m"
      resources.limits.memory: "2Gi"
      resources.requests.cpu: "500m"
      resources.requests.memory: "512Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2000m"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "2Gi"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "512Mi"
        template: templates/deployment.yaml

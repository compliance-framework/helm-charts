suite: Agent authentication
templates:
  - templates/secret.yaml
  - templates/configmap.yaml
  - templates/deployment.yaml
release:
  name: ccf-agent
  namespace: default

tests:
  - it: does not render secret by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml

  - it: does not render secret or env vars when auth is disabled even with credentials
    set:
      agent.api.auth.enabled: false
      agent.api.auth.createSecret: true
      agent.api.auth.clientId.value: "123e4567-e89b-12d3-a456-426614174000"
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_API_AUTH_CLIENT_ID")]
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_API_AUTH_CLIENT_SECRET")]
        template: templates/deployment.yaml

  - it: creates secret with the CCF_API_AUTH_* keys when createSecret is true and auth is enabled
    set:
      agent.api.auth.enabled: true
      agent.api.auth.createSecret: true
      agent.api.auth.clientId.value: "123e4567-e89b-12d3-a456-426614174000"
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: ccf-agent-auth
        template: templates/secret.yaml
      - equal:
          path: data["CCF_API_AUTH_CLIENT_ID"]
          value: "MTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDAw" # base64 of the UUID
        template: templates/secret.yaml
      - equal:
          path: data["CCF_API_AUTH_CLIENT_SECRET"]
          value: "dGVzdC1jbGllbnQtc2VjcmV0" # base64 for test-client-secret
        template: templates/secret.yaml
      - notExists:
          path: data["CCF_AGENT_API_AUTH_CLIENT_ID"]
        template: templates/secret.yaml

  - it: uses the chart secret in the deployment when createSecret is true
    set:
      agent.api.auth.enabled: true
      agent.api.auth.createSecret: true
      agent.api.auth.clientId.value: "123e4567-e89b-12d3-a456-426614174000"
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-agent-auth
                key: CCF_API_AUTH_CLIENT_ID
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ccf-agent-auth
                key: CCF_API_AUTH_CLIENT_SECRET
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_AGENT_API_AUTH_CLIENT_ID")]
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_AGENT_API_AUTH_CLIENT_SECRET")]
        template: templates/deployment.yaml

  - it: reads the CCF_API_AUTH_* keys from an existing secret by default
    set:
      agent.api.auth.enabled: true
      agent.api.auth.existingSecret: "ccf-agent-credentials"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ccf-agent-credentials
                key: CCF_API_AUTH_CLIENT_ID
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ccf-agent-credentials
                key: CCF_API_AUTH_CLIENT_SECRET
        template: templates/deployment.yaml

  - it: uses custom secretKeyRef keys from an existing secret when set
    set:
      agent.api.auth.enabled: true
      agent.api.auth.existingSecret: "external-agent-auth"
      agent.api.auth.clientId.secretKeyRef: "custom-client-id-key"
      agent.api.auth.clientSecret.secretKeyRef: "custom-client-secret-key"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: external-agent-auth
                key: custom-client-id-key
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: external-agent-auth
                key: custom-client-secret-key
        template: templates/deployment.yaml

  - it: uses plain values when neither createSecret nor existingSecret is set
    set:
      agent.api.auth.enabled: true
      agent.api.auth.clientId.value: "123e4567-e89b-12d3-a456-426614174000"
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_ID
            value: "123e4567-e89b-12d3-a456-426614174000"
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CCF_API_AUTH_CLIENT_SECRET
            value: test-client-secret
        template: templates/deployment.yaml

  - it: fails when only clientId is set
    set:
      agent.api.auth.enabled: true
      agent.api.auth.clientId.value: "123e4567-e89b-12d3-a456-426614174000"
    asserts:
      - failedTemplate:
          errorPattern: "needs both or neither"
        template: templates/secret.yaml

  - it: fails when only clientSecret is set
    set:
      agent.api.auth.enabled: true
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - failedTemplate:
          errorPattern: "needs both or neither"
        template: templates/secret.yaml

  - it: rejects a clientId that is not a UUID
    set:
      agent.api.auth.enabled: true
      agent.api.auth.clientId.value: "test-client-id"
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - failedTemplate: {}
        template: templates/deployment.yaml

  - it: fails when createSecret and existingSecret are both set
    set:
      agent.api.auth.enabled: true
      agent.api.auth.createSecret: true
      agent.api.auth.existingSecret: "external-agent-auth"
      agent.api.auth.clientId.value: "123e4567-e89b-12d3-a456-426614174000"
      agent.api.auth.clientSecret.value: "test-client-secret"
    asserts:
      - failedTemplate:
          errorPattern: "cannot set both createSecret and existingSecret"
        template: templates/secret.yaml

  - it: fails when a secretKeyRef is set without existingSecret
    set:
      agent.api.auth.enabled: true
      agent.api.auth.clientId.secretKeyRef: "client-id"
    asserts:
      - failedTemplate:
          errorPattern: "requires existingSecret"
        template: templates/secret.yaml

  - it: does not render auth env vars when both clientId and clientSecret are empty
    set:
      agent.api.auth.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_API_AUTH_CLIENT_ID")]
        template: templates/deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "CCF_API_AUTH_CLIENT_SECRET")]
        template: templates/deployment.yaml

suite: extraObjects parameter
templates:
  - templates/extra-objects.yaml
release:
  name: ccf-agent
  namespace: default

tests:
  - it: renders no documents when extraObjects is empty (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a single extra object
    values:
      - values/extra_objects_single.yaml
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
      - equal:
          path: metadata.name
          value: my-extra-config
      - equal:
          path: data.key
          value: value

  - it: renders multiple extra objects
    values:
      - values/extra_objects_multi.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: kind
          value: ConfigMap
        documentIndex: 0
      - equal:
          path: kind
          value: Secret
        documentIndex: 1

  - it: supports tpl rendering in extra objects
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-dynamic"
            namespace: "{{ .Release.Namespace }}"
          data:
            release: "{{ .Release.Name }}"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ccf-agent-dynamic
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: data.release
          value: ccf-agent

# Values for the Argo CD check (ci/argocd/check.sh).
agent:
  # Run continuously: a run-once agent exits and restarts, which Argo CD reports as Progressing
  # (chart versions before 0.4.0 default to daemon: false).
  daemon: true
  api:
    url: http://ccf-ccf-api.ccf.svc:8080
# Pod Security "restricted" also needs seccompProfile, which the ccf-agent chart sets by default
# from 0.4.0; set here so the check also covers older agent charts.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

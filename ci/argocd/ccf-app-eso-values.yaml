# Values for the Argo CD check (ci/argocd/check.sh): every credential generated by External
# Secrets Operator, which the check installs.
api:
  jwt:
    source: externalSecret
  user:
    externalSecret:
      enabled: true
  # The bootstrap Job logs in with the ESO-generated initial user password.
  agentBootstrap:
    enabled: true
    agents:
      - name: argocd-eso-agent
        secretName: argocd-eso-agent-credentials
database:
  local:
    externalSecret:
      enabled: true
    persistence:
      createPersistentVolume: false
      storageClass: standard
ingress:
  enabled: false
